// ============ LIFT (with workout journal) ============
// Returns the active workout program — either the active cycle's workouts or RICH_WORKOUTS defaults
function getActiveWorkouts(){if(!store.workoutCycles||!store.workoutCycles.length||!store.activeCycleId){return RICH_WORKOUTS}const c=store.workoutCycles.find(x=>x.id===store.activeCycleId);return c?c.workouts:RICH_WORKOUTS}
function getActiveCycle(){if(!store.workoutCycles||!store.activeCycleId)return null;return store.workoutCycles.find(x=>x.id===store.activeCycleId)}
function ensureCycle(){if(!store.workoutCycles||!store.workoutCycles.length){const c={id:'c_'+Date.now().toString(36),name:'Default Cycle',startDate:todayStr(),endDate:'',linkedGoalId:null,linkedRockId:null,workouts:JSON.parse(JSON.stringify(RICH_WORKOUTS))};store.workoutCycles=[c];store.activeCycleId=c.id;saveAll()}else if(!store.activeCycleId){store.activeCycleId=store.workoutCycles[0].id;saveAll()}}

function renderLift(){ensureCycle();const cycle=getActiveCycle();const WORKOUTS=getActiveWorkouts();const cycleSelect=`<select class="form-select" style="max-width:240px" onchange="switchCycle(this.value)">${store.workoutCycles.map(c=>`<option value="${c.id}" ${c.id===store.activeCycleId?'selected':''}>${escapeHTML(c.name)}</option>`).join('')}</select>`;const linkedGoal=cycle&&cycle.linkedGoalId?(store.goals||[]).find(g=>g.id===cycle.linkedGoalId):null;const linkedRock=cycle&&cycle.linkedRockId?(store.rocks||[]).find(r=>r.id===cycle.linkedRockId):null;const linkInfo=(linkedGoal||linkedRock)?`<div style="margin-top:8px;font-size:11px;color:var(--text-dim)">${linkedGoal?`→ Goal: <span style="color:var(--gold)">${escapeHTML(linkedGoal.title)}</span>`:''}${linkedRock?`${linkedGoal?' · ':''}→ Rock: <span style="color:var(--gold)">${escapeHTML(linkedRock.title)}</span>`:''}</div>`:'';
document.getElementById('liftContent').innerHTML=`<div class="section"><div class="section-label"><span>Workout Cycle</span><span class="meta">Tempo 3-1-1 · RIR 1-2</span></div><div class="card"><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px">${cycleSelect}<button class="btn outline sm" onclick="manageCycles()">MANAGE CYCLES</button></div>${linkInfo}<div style="margin-top:10px;font-size:11px;color:var(--text-faint);font-style:italic">Tap <strong style="color:var(--gold);font-style:normal">LOG WEIGHTS & REPS</strong> to journal a set · tap <strong style="color:var(--gold);font-style:normal">✎ PROGRAM</strong> to change the prescribed sets/reps</div></div></div><div class="section"><div class="section-label"><span>Weekly Split</span><span class="meta">${escapeHTML(cycle?cycle.name:'Default')}</span></div><div id="liftSchedule"></div></div>`;
const today=new Date().getDay();const days=[1,2,3,4,5,6,0];
document.getElementById('liftSchedule').innerHTML=days.map(wd=>{const w=WORKOUTS[wd];if(!w)return'';const isToday=wd===today;const todayKey=todayStr();const todayLog=(store.workouts[todayKey]&&store.workouts[todayKey].weekday===wd)?store.workouts[todayKey]:null;const exHTML=w.exercises.length?w.exercises.map(ex=>{const last=getLastSession(ex.id);const ts=todayLog&&todayLog.exercises[ex.id]?todayLog.exercises[ex.id].sets:null;const isLogged=ts&&ts.some(s=>s.w||s.r);return`<div class="exercise-row ${isLogged?'logged':''}"><div class="exercise-name"><span>${escapeHTML(ex.name)}</span><span style="color:var(--gold-dim);font-size:11px">${ex.sets}×${ex.reps}</span></div>${last?`<div class="exercise-last">Last: ${last.summary}</div>`:`<div class="exercise-last" style="color:var(--text-faint)">No previous session</div>`}<div style="display:flex;gap:6px;margin-top:8px"><button class="btn sm" style="padding:6px 12px;font-size:11px;flex:1" onclick="openExerciseLog('${ex.id}',${wd})">${isLogged?'✓ EDIT TODAY':'LOG WEIGHTS & REPS'}</button><button class="btn outline sm" style="padding:6px 10px;font-size:10px" onclick="editExercise(${wd},'${ex.id}')">✎ PROGRAM</button></div></div>`}).join(''):`<div class="empty" style="padding:12px 0">No exercises. Add one below.</div>`;return`<div class="day-card ${isToday?'today':''}"><div class="day-header"><div class="day-name">${escapeHTML(w.name)}${isToday?'<span class="today-pill">TODAY</span>':''}</div><div class="day-type">${escapeHTML(w.type||'')}</div></div><div class="day-purpose">${escapeHTML(w.purpose||'')}</div>${w.tempo&&w.tempo!=='—'?`<div class="tempo-rir">TEMPO ${escapeHTML(w.tempo)} · RIR ${escapeHTML(w.rir||'')}</div>`:''}${w.am&&w.am!=='—'?`<div style="margin-top:10px;padding:8px 10px;background:var(--bg-deep);border-left:2px solid var(--green);border-radius:0 3px 3px 0;font-size:12px"><strong style="color:var(--green);font-size:9px;letter-spacing:0.2em">AM ·</strong> ${escapeHTML(w.am)}</div>`:''}${exHTML}<div style="display:flex;gap:6px;margin-top:10px;flex-wrap:wrap"><button class="btn outline sm" onclick="addExercise(${wd})">+ ADD EXERCISE</button><button class="btn outline sm" onclick="editDay(${wd})">EDIT DAY HEADER</button></div></div>`}).join('')}

window.switchCycle=(id)=>{store.activeCycleId=id;saveAll();renderLift()};
window.manageCycles=()=>{const list=store.workoutCycles.map(c=>{const g=c.linkedGoalId?(store.goals||[]).find(x=>x.id===c.linkedGoalId):null;const r=c.linkedRockId?(store.rocks||[]).find(x=>x.id===c.linkedRockId):null;return`<div style="padding:10px;background:var(--bg-deep);border:1px solid var(--border);border-radius:3px;margin-bottom:8px"><div style="font-family:var(--serif);font-weight:600;color:var(--gold);font-size:13px">${escapeHTML(c.name)}${c.id===store.activeCycleId?'<span style="font-size:9px;color:var(--green);margin-left:8px;letter-spacing:0.2em">ACTIVE</span>':''}</div><div style="font-size:11px;color:var(--text-dim);margin-top:4px">${c.startDate||'—'} → ${c.endDate||'ongoing'}${g?` · Goal: ${escapeHTML(g.title.slice(0,30))}`:''}${r?` · Rock: ${escapeHTML(r.title.slice(0,30))}`:''}</div><div style="display:flex;gap:6px;margin-top:6px;flex-wrap:wrap"><button class="btn outline sm" onclick="setActiveCycle('${c.id}')">SET ACTIVE</button><button class="btn outline sm" onclick="editCycle('${c.id}')">EDIT</button><button class="btn outline sm" onclick="duplicateCycle('${c.id}')">DUPLICATE</button>${store.workoutCycles.length>1?`<button class="btn danger outline sm" onclick="deleteCycle('${c.id}')">DELETE</button>`:''}</div></div>`}).join('');openModal(`<h3>Manage Workout Cycles</h3><p style="color:var(--text-dim);font-size:12px;margin-bottom:14px">Each cycle = its own program. Switch cycles every 4-12 weeks. Old workouts stay in history.</p>${list}<div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap"><button class="btn full" onclick="newCycle()">+ NEW (blank)</button><button class="btn outline full" onclick="newCycleFromDefault()">+ NEW (copy Rich defaults)</button></div><button class="btn full outline" style="margin-top:8px" onclick="closeModal()">CLOSE</button>`)};
window.setActiveCycle=(id)=>{store.activeCycleId=id;saveAll();closeModal();renderLift();showToast("CYCLE ACTIVE")};
window.editCycle=(id)=>{const c=store.workoutCycles.find(x=>x.id===id);if(!c)return;const goalOpts=`<option value="">— None —</option>`+(store.goals||[]).map(g=>`<option value="${g.id}" ${g.id===c.linkedGoalId?'selected':''}>${escapeHTML(g.title.slice(0,60))}</option>`).join('');const rockOpts=`<option value="">— None —</option>`+(store.rocks||[]).map(r=>`<option value="${r.id}" ${r.id===c.linkedRockId?'selected':''}>${escapeHTML(r.title.slice(0,60))}</option>`).join('');openModal(`<h3>Edit Cycle</h3><div class="form-grid"><div class="form-field"><div class="form-label">Cycle Name</div><input type="text" class="form-input" id="cycName" value="${escapeHTML(c.name)}"></div><div class="form-row"><div class="form-field"><div class="form-label">Start</div><input type="date" class="form-input" id="cycStart" value="${c.startDate||''}"></div><div class="form-field"><div class="form-label">End</div><input type="date" class="form-input" id="cycEnd" value="${c.endDate||''}"></div></div><div class="form-field"><div class="form-label">Linked Goal</div><select class="form-select" id="cycGoal">${goalOpts}</select></div><div class="form-field"><div class="form-label">Linked Rock</div><select class="form-select" id="cycRock">${rockOpts}</select></div><button class="btn full" onclick="saveCycleEdit('${id}')">SAVE</button><button class="btn full outline" onclick="manageCycles()">BACK</button></div>`)};
window.saveCycleEdit=(id)=>{const c=store.workoutCycles.find(x=>x.id===id);if(!c)return;c.name=document.getElementById('cycName').value||'Cycle';c.startDate=document.getElementById('cycStart').value;c.endDate=document.getElementById('cycEnd').value;c.linkedGoalId=document.getElementById('cycGoal').value||null;c.linkedRockId=document.getElementById('cycRock').value||null;saveAll();manageCycles();showToast("UPDATED")};
window.newCycle=()=>{const name=prompt("Name for new cycle (e.g., 'Hyrox Prep Wk1-4'):");if(!name)return;const blank={};[1,2,3,4,5,6,0].forEach(wd=>{blank[wd]={name:['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][wd],weekday:wd,type:"",purpose:"",tempo:"",rir:"",am:"—",pm:"—",exercises:[]}});const c={id:'c_'+Date.now().toString(36),name,startDate:todayStr(),endDate:'',linkedGoalId:null,linkedRockId:null,workouts:blank};store.workoutCycles.push(c);store.activeCycleId=c.id;saveAll();closeModal();renderLift();showToast("NEW CYCLE")};
window.newCycleFromDefault=()=>{const name=prompt("Name for new cycle:");if(!name)return;const c={id:'c_'+Date.now().toString(36),name,startDate:todayStr(),endDate:'',linkedGoalId:null,linkedRockId:null,workouts:JSON.parse(JSON.stringify(RICH_WORKOUTS))};store.workoutCycles.push(c);store.activeCycleId=c.id;saveAll();closeModal();renderLift();showToast("NEW CYCLE")};
window.duplicateCycle=(id)=>{const c=store.workoutCycles.find(x=>x.id===id);if(!c)return;const name=prompt("Name for the copy:",c.name+' (copy)');if(!name)return;const nc=JSON.parse(JSON.stringify(c));nc.id='c_'+Date.now().toString(36);nc.name=name;nc.startDate=todayStr();nc.endDate='';store.workoutCycles.push(nc);saveAll();manageCycles();showToast("DUPLICATED")};
window.deleteCycle=(id)=>{if(!confirm("Delete this cycle? Workouts you already logged stay in history."))return;store.workoutCycles=store.workoutCycles.filter(x=>x.id!==id);if(store.activeCycleId===id)store.activeCycleId=store.workoutCycles[0]?store.workoutCycles[0].id:null;saveAll();manageCycles();renderLift()};

window.editDay=(wd)=>{const W=getActiveWorkouts();const d=W[wd];if(!d)return;openModal(`<h3>Edit Day — ${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][wd]}</h3><div class="form-grid"><div class="form-field"><div class="form-label">Name</div><input type="text" class="form-input" id="dayName" value="${escapeHTML(d.name)}"></div><div class="form-field"><div class="form-label">Type (label)</div><input type="text" class="form-input" id="dayType" value="${escapeHTML(d.type||'')}"></div><div class="form-field"><div class="form-label">Purpose</div><textarea class="form-textarea" id="dayPurpose">${escapeHTML(d.purpose||'')}</textarea></div><div class="form-row"><div class="form-field"><div class="form-label">Tempo</div><input type="text" class="form-input" id="dayTempo" value="${escapeHTML(d.tempo||'')}"></div><div class="form-field"><div class="form-label">RIR</div><input type="text" class="form-input" id="dayRir" value="${escapeHTML(d.rir||'')}"></div></div><div class="form-field"><div class="form-label">AM Note (cardio/yoga/hike)</div><textarea class="form-textarea" id="dayAm">${escapeHTML(d.am||'')}</textarea></div><div class="form-field"><div class="form-label">PM Note</div><textarea class="form-textarea" id="dayPm">${escapeHTML(d.pm||'')}</textarea></div><button class="btn full" onclick="saveDayEdit(${wd})">SAVE</button><button class="btn full outline" onclick="closeModal()">CANCEL</button></div>`)};
window.saveDayEdit=(wd)=>{const cycle=getActiveCycle();if(!cycle){alert("No active cycle");return}const d=cycle.workouts[wd];if(!d)return;d.name=document.getElementById('dayName').value||d.name;d.type=document.getElementById('dayType').value;d.purpose=document.getElementById('dayPurpose').value;d.tempo=document.getElementById('dayTempo').value;d.rir=document.getElementById('dayRir').value;d.am=document.getElementById('dayAm').value||'—';d.pm=document.getElementById('dayPm').value||'—';saveAll();closeModal();renderLift();showToast("DAY UPDATED")};

window.addExercise=(wd)=>{openModal(`<h3>Add Exercise</h3><div class="form-grid"><div class="form-field"><div class="form-label">Exercise Name</div><input type="text" class="form-input" id="exName" autofocus></div><div class="form-row"><div class="form-field"><div class="form-label">Sets</div><input type="number" class="form-input" id="exSets" value="3"></div><div class="form-field"><div class="form-label">Reps (e.g. 8–10)</div><input type="text" class="form-input" id="exReps" value="8–10"></div></div><button class="btn full" onclick="saveNewExercise(${wd})">SAVE</button><button class="btn full outline" onclick="closeModal()">CANCEL</button></div>`)};
window.saveNewExercise=(wd)=>{const cycle=getActiveCycle();if(!cycle){alert("No active cycle");return}const d=cycle.workouts[wd];if(!d)return;const name=document.getElementById('exName').value;if(!name){alert("Name required");return}const ex={id:'ex_'+Date.now().toString(36),name,sets:parseInt(document.getElementById('exSets').value)||3,reps:document.getElementById('exReps').value||'8–10'};d.exercises.push(ex);saveAll();closeModal();renderLift();showToast("EXERCISE ADDED")};

window.editExercise=(wd,exId)=>{const W=getActiveWorkouts();const d=W[wd];const ex=d.exercises.find(e=>e.id===exId);if(!ex)return;openModal(`<h3>Edit Exercise</h3><div class="form-grid"><div class="form-field"><div class="form-label">Name</div><input type="text" class="form-input" id="exName" value="${escapeHTML(ex.name)}"></div><div class="form-row"><div class="form-field"><div class="form-label">Sets</div><input type="number" class="form-input" id="exSets" value="${ex.sets}"></div><div class="form-field"><div class="form-label">Reps</div><input type="text" class="form-input" id="exReps" value="${escapeHTML(ex.reps)}"></div></div><button class="btn full" onclick="saveExerciseEdit(${wd},'${exId}')">SAVE</button><button class="btn danger outline full" onclick="deleteExerciseFromDay(${wd},'${exId}')">DELETE EXERCISE</button><button class="btn full outline" onclick="closeModal()">CANCEL</button></div>`)};
window.saveExerciseEdit=(wd,exId)=>{const cycle=getActiveCycle();if(!cycle)return;const d=cycle.workouts[wd];const ex=d.exercises.find(e=>e.id===exId);if(!ex)return;ex.name=document.getElementById('exName').value||ex.name;ex.sets=parseInt(document.getElementById('exSets').value)||ex.sets;ex.reps=document.getElementById('exReps').value||ex.reps;saveAll();closeModal();renderLift();showToast("EXERCISE UPDATED")};
window.deleteExerciseFromDay=(wd,exId)=>{if(!confirm("Delete this exercise from the day? History stays."))return;const cycle=getActiveCycle();if(!cycle)return;cycle.workouts[wd].exercises=cycle.workouts[wd].exercises.filter(e=>e.id!==exId);saveAll();closeModal();renderLift();showToast("DELETED")};
function getLastSession(exerciseId){const history=store.exerciseHistory[exerciseId]||[];if(!history.length)return null;const today=todayStr();const past=history.filter(h=>h.date!==today).sort((a,b)=>b.date.localeCompare(a.date));if(!past.length)return null;const last=past[0];const summary=last.sets.map(s=>`${s.w||'—'}×${s.r||'—'}`).join(' · ');const da=daysBetween(new Date(last.date),new Date());return{date:last.date,sets:last.sets,summary:`${summary}  (${da}d ago)`}}
window.openExerciseLog=(exId,weekday)=>{const W=getActiveWorkouts();const w=W[weekday];const ex=w.exercises.find(e=>e.id===exId);if(!ex)return;const today=todayStr();let tw=store.workouts[today];if(!tw||tw.weekday!==weekday){tw={weekday,exercises:{}};store.workouts[today]=tw}if(!tw.exercises[exId])tw.exercises[exId]={name:ex.name,sets:Array.from({length:ex.sets},()=>({w:'',r:''}))};const sets=tw.exercises[exId].sets;const last=getLastSession(exId);const setRows=sets.map((s,i)=>`<div class="set-row"><div class="set-num">${i+1}</div><input type="number" placeholder="weight" value="${s.w}" data-setidx="${i}" data-field="w"><input type="number" placeholder="reps" value="${s.r}" data-setidx="${i}" data-field="r"><button class="remove" onclick="removeSet(${i})">×</button></div>`).join('');let suggestion='';if(last&&last.sets.length){const lastTop=Math.max(...last.sets.map(s=>parseFloat(s.w)||0));if(lastTop>0){const targetReps=parseInt(ex.reps.split('–')[1]||ex.reps);const lastTopReps=Math.max(...last.sets.map(s=>parseInt(s.r)||0));if(lastTopReps>=targetReps){suggestion=`<div style="background:rgba(91,174,124,0.1);border:1px solid var(--green);border-radius:3px;padding:10px 12px;margin-bottom:14px;font-size:12px;color:var(--green)">↑ You hit top range — try <strong>${lastTop+5} × ${ex.reps}</strong></div>`}else{suggestion=`<div style="background:rgba(90,192,224,0.08);border:1px solid var(--gold-dim);border-radius:3px;padding:10px 12px;margin-bottom:14px;font-size:12px;color:var(--gold)">Hold weight at <strong>${lastTop} lb</strong> — aim for ${targetReps} reps before adding load.</div>`}}}openModal(`<h3>${escapeHTML(ex.name)}</h3><div style="font-size:11px;color:var(--text-faint);margin-bottom:14px">Prescribed: ${ex.sets} × ${ex.reps}${w.tempo&&w.tempo!=='—'?` · Tempo ${w.tempo} · RIR ${w.rir}`:''}</div>${suggestion}${last?`<div style="font-size:12px;color:var(--text-dim);margin-bottom:14px">Last (${daysBetween(new Date(last.date),new Date())}d ago): ${last.sets.map(s=>`${s.w||'—'}×${s.r||'—'}`).join(' · ')}</div>`:''}<div class="set-row" style="border-bottom:1px solid var(--border);padding-bottom:6px;margin-bottom:6px;color:var(--text-faint);font-size:10px;letter-spacing:0.15em;text-transform:uppercase"><div class="set-num">SET</div><div style="text-align:center">WEIGHT</div><div style="text-align:center">REPS</div><div></div></div><div id="setRowsContainer">${setRows}</div><div style="display:flex;gap:8px;margin-top:14px"><button class="btn outline sm" onclick="addSet('${exId}',${weekday})">+ ADD SET</button>${(store.exerciseHistory[exId]||[]).length?`<button class="btn outline sm" onclick="showExerciseHistory('${exId}')">HISTORY</button>`:''}</div><div style="display:flex;gap:8px;margin-top:14px"><button class="btn full" onclick="saveExerciseLog('${exId}',${weekday})">SAVE</button><button class="btn full outline" onclick="closeModal()">CLOSE</button></div>`)};
window.showExerciseHistory=(exId)=>{const h=(store.exerciseHistory[exId]||[]).slice().reverse();openModal(`<h3>Exercise History</h3><div style="max-height:400px;overflow-y:auto">${h.map(x=>`<div style="padding:10px 0;border-bottom:1px solid var(--border)"><div style="font-family:var(--serif);font-weight:600;color:var(--gold);font-size:13px">${new Date(x.date).toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})}</div><div style="font-size:13px;color:var(--text);margin-top:4px">${x.sets.map((s,i)=>`Set ${i+1}: <strong>${s.w||'—'}</strong> × ${s.r||'—'}`).join('  ·  ')}</div></div>`).join('')}</div><button class="btn full outline" style="margin-top:14px" onclick="closeModal()">CLOSE</button>`)};
window.addSet=(exId,weekday)=>{const today=todayStr();const tw=store.workouts[today];if(!tw||!tw.exercises[exId])return;tw.exercises[exId].sets.push({w:'',r:''});saveAll();openExerciseLog(exId,weekday)};
window.removeSet=(idx)=>{const rows=document.querySelectorAll('#setRowsContainer .set-row');if(rows[idx])rows[idx].remove()};

function getConstitutionSections(){return store.constitutionSections||DEFAULT_CONST_SECTIONS}

function renderConstitution(){const secs=getConstitutionSections();const nav=secs.map(s=>`<button onclick="scrollToConst('${s.id}')">${escapeHTML(s.title)}</button>`).join('');const blocks=secs.map(s=>`<div class="mission-block" id="const-${s.id}"><div class="mission-title">${escapeHTML(s.title)}</div><div class="mission-prose" style="white-space:pre-wrap">${escapeHTML(s.content)}</div><div style="display:flex;gap:6px;margin-top:12px;flex-wrap:wrap"><button class="btn outline sm" onclick="editConstSection('${s.id}')">✎ EDIT</button><button class="btn outline sm" onclick="moveConstSection('${s.id}',-1)">↑</button><button class="btn outline sm" onclick="moveConstSection('${s.id}',1)">↓</button><button class="btn danger outline sm" onclick="deleteConstSection('${s.id}')">DELETE</button></div></div>`).join('');document.getElementById('constitutionContent').innerHTML=`<div class="const-nav">${nav}</div>${blocks}<div class="card" style="margin-top:14px;text-align:center;display:flex;gap:8px;justify-content:center;flex-wrap:wrap"><button class="btn outline" onclick="addConstSection()">+ ADD SECTION</button><button class="btn outline" onclick="resetConstitution()">RESET TO RICH DEFAULTS</button></div>`}
window.editConstSection=(id)=>{const secs=getConstitutionSections();const s=secs.find(x=>x.id===id);if(!s)return;openModal(`<h3>Edit ${escapeHTML(s.title)}</h3><div class="form-grid"><div class="form-field"><div class="form-label">Section Title</div><input type="text" class="form-input" id="csTitle" value="${escapeHTML(s.title)}"></div><div class="form-field"><div class="form-label">Content</div><textarea class="form-textarea" id="csContent" style="min-height:240px">${escapeHTML(s.content)}</textarea></div><button class="btn full" onclick="saveConstSection('${id}')">SAVE</button><button class="btn full outline" onclick="closeModal()">CANCEL</button></div>`)};
window.saveConstSection=(id)=>{if(!store.constitutionSections)store.constitutionSections=JSON.parse(JSON.stringify(DEFAULT_CONST_SECTIONS));const s=store.constitutionSections.find(x=>x.id===id);if(!s)return;s.title=document.getElementById('csTitle').value||s.title;s.content=document.getElementById('csContent').value;saveAll();closeModal();renderConstitution();showToast("SECTION SAVED")};
window.addConstSection=()=>{openModal(`<h3>Add Section</h3><div class="form-grid"><div class="form-field"><div class="form-label">Title</div><input type="text" class="form-input" id="csTitle"></div><div class="form-field"><div class="form-label">Content</div><textarea class="form-textarea" id="csContent" style="min-height:240px"></textarea></div><button class="btn full" onclick="saveNewConstSection()">SAVE</button><button class="btn full outline" onclick="closeModal()">CANCEL</button></div>`)};
window.saveNewConstSection=()=>{const t=document.getElementById('csTitle').value;if(!t)return alert("Title required");if(!store.constitutionSections)store.constitutionSections=JSON.parse(JSON.stringify(DEFAULT_CONST_SECTIONS));store.constitutionSections.push({id:'cs_'+Date.now().toString(36),title:t,type:'text',content:document.getElementById('csContent').value});saveAll();closeModal();renderConstitution();showToast("ADDED")};
window.deleteConstSection=(id)=>{if(!confirm("Delete this section?"))return;if(!store.constitutionSections)store.constitutionSections=JSON.parse(JSON.stringify(DEFAULT_CONST_SECTIONS));store.constitutionSections=store.constitutionSections.filter(s=>s.id!==id);saveAll();renderConstitution()};
window.moveConstSection=(id,dir)=>{if(!store.constitutionSections)store.constitutionSections=JSON.parse(JSON.stringify(DEFAULT_CONST_SECTIONS));const arr=store.constitutionSections;const idx=arr.findIndex(s=>s.id===id);if(idx<0)return;const ni=idx+dir;if(ni<0||ni>=arr.length)return;[arr[idx],arr[ni]]=[arr[ni],arr[idx]];saveAll();renderConstitution()};
window.resetConstitution=()=>{if(!confirm("Reset constitution to Rich's defaults? You'll lose any custom sections."))return;store.constitutionSections=null;saveAll();renderConstitution();showToast("RESET")};

window.addRole=()=>{openModal(`<h3>Add Role</h3><div class="form-grid"><div class="form-field"><div class="form-label">Role Name</div><input type="text" class="form-input" id="roleName" placeholder="e.g., Father, Coach, CEO"></div><div class="form-field"><div class="form-label">Success Definition</div><textarea class="form-textarea" id="roleSuccess"></textarea></div><button class="btn full" onclick="saveNewRole()">SAVE</button><button class="btn full outline" onclick="closeModal()">CANCEL</button></div>`)};
window.saveNewRole=()=>{const n=document.getElementById('roleName').value;const s=document.getElementById('roleSuccess').value;if(!n)return alert("Name required");if(!store.accountabilityRoles)store.accountabilityRoles=[];store.accountabilityRoles.push({name:n,success:s});saveAll();closeModal();renderRolesEdit();showToast("ROLE ADDED")};
window.editRole=(i)=>{const r=store.accountabilityRoles[i];if(!r)return;openModal(`<h3>Edit Role</h3><div class="form-grid"><div class="form-field"><div class="form-label">Name</div><input type="text" class="form-input" id="roleName" value="${escapeHTML(r.name)}"></div><div class="form-field"><div class="form-label">Success</div><textarea class="form-textarea" id="roleSuccess">${escapeHTML(r.success)}</textarea></div><button class="btn full" onclick="saveEditRole(${i})">SAVE</button><button class="btn full outline" onclick="closeModal()">CANCEL</button></div>`)};
window.saveEditRole=(i)=>{store.accountabilityRoles[i]={name:document.getElementById('roleName').value,success:document.getElementById('roleSuccess').value};saveAll();closeModal();renderRolesEdit();showToast("UPDATED")};
window.deleteRole=(i)=>{if(!confirm("Delete?"))return;store.accountabilityRoles.splice(i,1);saveAll();renderRolesEdit()};
window.saveSettings=()=>{store.name=document.getElementById('setName').value||'Unnamed';store.vision=document.getElementById('setVision').value;store.race=document.getElementById('setRace').value;store.raceDate=document.getElementById('setRaceDate').value;store.startDate=document.getElementById('setStart').value;store.quarterEnd=document.getElementById('setQEnd').value;saveAll();renderApp();showToast("SAVED")};
window.saveDomainNames=()=>{const names=[];document.querySelectorAll('[data-dn]').forEach(input=>names.push(input.value));store.domainNames=names;saveAll();showToast("SAVED")};
window.saveCircle=()=>{store.circle.forEach((c,i)=>{c.name=document.querySelector(`[data-circle-name="${i}"]`).value;c.growth=parseInt(document.querySelector(`[data-circle-growth="${i}"]`).value)||0;c.emotional=parseInt(document.querySelector(`[data-circle-emotional="${i}"]`).value)||0;c.professional=parseInt(document.querySelector(`[data-circle-professional="${i}"]`).value)||0;c.energy=parseInt(document.querySelector(`[data-circle-energy="${i}"]`).value)||0});saveAll();showToast("SAVED")};
window.saveDreamScape=()=>{store.dreamScape=document.getElementById('dreamScapeText').value;saveAll();showToast("SAVED")};

// ============ EXPORT/IMPORT ============
window.exportData=()=>{const blob=new Blob([JSON.stringify(allData,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`lifeos-${todayStr()}.json`;a.click();URL.revokeObjectURL(url);showToast("DOWNLOADED")};
window.importData=(e)=>{const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=(ev)=>{try{const imp=JSON.parse(ev.target.result);if(confirm("Replace ALL data?")){if(imp.people){allData=imp}else if(imp.daily){allData={active:'rich',people:{rich:imp}}}else allData=imp;Object.values(allData.people).forEach(p=>{const f=makeFreshPerson("","");Object.keys(f).forEach(k=>{if(p[k]===undefined)p[k]=f[k]})});store=allData.people[allData.active];saveAll();renderApp();showToast("IMPORTED")}}catch(err){alert("Invalid file")}};reader.readAsText(file)};

// ============ INIT ============
function renderApp(){renderPersonSwitch();renderHome()}
renderApp();
</script>
</body>
</html>
