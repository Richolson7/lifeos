<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Life OS">
<meta name="theme-color" content="#0A0A0A">
<title>Life OS · Command Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg-deep:#050810;--bg:#0A0F1A;--bg-elev:#101828;--bg-card:#141C2E;--bg-card-hover:#1F2A3E;--border:#1F2A3E;--border-bright:#2D3D57;--gold:#5AC0E0;--gold-bright:#8BD5EA;--gold-dim:#2A6B80;--text:#F5F0E8;--text-dim:#B5AFA5;--text-faint:#6B6660;--red:#C74A3A;--red-deep:#8B3628;--green:#5BAE7C;--amber:#D9A05B;--purple:#7C8FA8;--serif:'Cormorant Garamond',Georgia,serif;--sans:'Inter',-apple-system,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overscroll-behavior:none}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;background-image:radial-gradient(ellipse at top,rgba(90,192,224,0.02) 0%,transparent 50%);background-attachment:fixed}
.header{background:linear-gradient(180deg,var(--bg-deep),var(--bg));border-bottom:1px solid var(--border);padding:10px 16px;text-align:center;position:sticky;top:0;z-index:50;backdrop-filter:blur(12px);display:flex;justify-content:center;align-items:center;gap:8px}
.back-bar{display:none;align-items:center;gap:10px;background:var(--bg-elev);border-bottom:1px solid var(--gold-dim);padding:12px 16px;position:sticky;top:0;z-index:45;cursor:pointer;transition:background 0.15s}
.back-bar.show{display:flex}
.back-bar:hover{background:var(--bg-card-hover)}
.back-bar .arrow{color:var(--gold);font-size:18px;font-weight:700}
.back-bar .label{color:var(--gold);font-size:11px;letter-spacing:0.2em;text-transform:uppercase;font-weight:700;flex:1}
.back-bar .current{color:var(--text-dim);font-size:10px;letter-spacing:0.15em;text-transform:uppercase}
.menu-btn{background:transparent;border:1px solid var(--border-bright);color:var(--text-dim);padding:5px 10px;font-size:10px;font-weight:600;letter-spacing:0.15em;text-transform:uppercase;border-radius:3px;cursor:pointer}
.menu-btn:hover{color:var(--gold);border-color:var(--gold-dim)}
.person-switch{display:flex;justify-content:center;align-items:center;gap:8px;margin-bottom:8px;padding-bottom:8px;border-bottom:1px solid var(--border)}
.person-switch select{background:var(--bg-deep);border:1px solid var(--gold-dim);color:var(--gold);padding:5px 10px;font-size:10px;font-weight:600;letter-spacing:0.2em;text-transform:uppercase;border-radius:3px;cursor:pointer}
.person-switch button{background:transparent;border:1px solid var(--gold-dim);color:var(--gold);padding:5px 10px;font-size:10px;font-weight:600;letter-spacing:0.15em;text-transform:uppercase;border-radius:3px;cursor:pointer}
.brand{font-family:var(--serif);font-size:11px;letter-spacing:0.4em;text-transform:uppercase;color:var(--gold);margin-bottom:3px}
.brand-name{font-family:var(--serif);font-size:20px;font-weight:600;letter-spacing:0.05em;color:var(--text);margin-bottom:3px}
.vision{font-family:var(--serif);font-size:12px;font-style:italic;color:var(--text-dim);max-width:560px;margin:0 auto 8px;line-height:1.4}
.countdown{font-size:9px;letter-spacing:0.2em;text-transform:uppercase;color:var(--gold);font-weight:600}
.countdown .days{color:var(--text);font-size:13px;font-weight:700}
.tabs{display:none;background:var(--bg-deep);border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none;position:sticky;top:0;z-index:40}
.tabs.show{display:flex}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;padding:13px 14px;background:transparent;border:none;border-bottom:2px solid transparent;color:var(--text-dim);font-size:11px;font-weight:600;letter-spacing:0.15em;text-transform:uppercase;cursor:pointer;white-space:nowrap}
.tab:hover{color:var(--text)}
.tab.active{color:var(--gold);border-bottom-color:var(--gold)}
main{padding:20px 16px 60px;max-width:760px;margin:0 auto}
.view{display:none}.view.active{display:block}
.section{margin-bottom:28px}
.section-label{font-size:10px;letter-spacing:0.3em;text-transform:uppercase;color:var(--gold);font-weight:600;margin-bottom:10px;padding-left:4px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.section-label .meta{color:var(--text-faint);font-size:9px;letter-spacing:0.2em}
.card{background:var(--bg-card);border:1px solid var(--border);border-radius:4px;padding:18px}
.card.elev{background:var(--bg-elev)}
.big3-grid{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:640px){.big3-grid{grid-template-columns:1fr 1fr 1fr}}
.big3-col{background:var(--bg-card);border:1px solid var(--border);border-radius:4px;padding:14px}
.big3-col-title{font-family:var(--serif);font-size:13px;font-weight:600;letter-spacing:0.2em;text-transform:uppercase;color:var(--gold);margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--border)}
.big3-input{width:100%;background:transparent;border:none;border-bottom:1px solid var(--border);padding:8px 0;color:var(--text);font-size:14px;margin-bottom:6px}
.big3-input:focus{outline:none;border-bottom-color:var(--gold)}
.big3-input.done{color:var(--text-faint);text-decoration:line-through}
.big3-row{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.big3-row .check{width:18px;height:18px;border:1px solid var(--border-bright);border-radius:3px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.big3-row .check.checked{background:var(--gold);border-color:var(--gold)}
.big3-row .check.checked::after{content:"✓";color:var(--bg);font-size:12px;font-weight:700}
.l10-row{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--border)}
.l10-row:last-child{border-bottom:none}
.l10-label{flex:0 0 110px;font-size:13px;color:var(--text)}
.l10-bar{flex:1;height:6px;background:var(--bg-deep);border-radius:3px;overflow:hidden}
.l10-fill{height:100%;background:linear-gradient(90deg,var(--gold-dim),var(--gold));transition:width 0.4s}
.l10-score{flex:0 0 60px;text-align:right;font-family:var(--serif);font-size:22px;font-weight:600;color:var(--gold)}
.l10-score .denom{font-size:13px;color:var(--text-faint)}
.kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(min-width:640px){.kpi-grid{grid-template-columns:repeat(4,1fr)}}
.kpi{background:var(--bg-card);border:1px solid var(--border);border-radius:4px;padding:14px 12px;text-align:center;position:relative}
.kpi::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:0.4}
.kpi-label{font-size:9px;letter-spacing:0.2em;text-transform:uppercase;color:var(--text-faint);font-weight:600;margin-bottom:6px}
.kpi-value{font-family:var(--serif);font-size:26px;font-weight:600;color:var(--text);line-height:1}
.kpi-value .unit{font-size:12px;color:var(--text-faint);margin-left:2px}
.kpi-sub{font-size:10px;color:var(--text-faint);margin-top:4px;letter-spacing:0.1em}
.drift-flag{display:flex;gap:12px;padding:12px 14px;background:var(--bg-card);border:1px solid var(--border);border-left:2px solid var(--green);border-radius:3px;margin-bottom:8px;font-size:13px}
.drift-flag.warning{border-left-color:var(--red)}
.drift-flag .icon{flex:0 0 16px;font-family:var(--serif);font-weight:700;color:var(--green)}
.drift-flag.warning .icon{color:var(--red)}
.drift-flag .text{color:var(--text);flex:1}
.filter-bar{background:linear-gradient(135deg,rgba(90,192,224,0.15),rgba(90,192,224,0.05));border:1px solid var(--gold-dim);border-radius:4px;padding:14px 18px;text-align:center;font-family:var(--serif);font-size:14px;font-style:italic;color:var(--text)}
.filter-bar .pillars{margin-top:6px;font-size:10px;letter-spacing:0.3em;color:var(--gold);font-style:normal;font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;background:var(--gold);color:var(--bg);border:none;border-radius:3px;font-family:var(--sans);font-size:12px;font-weight:700;letter-spacing:0.15em;text-transform:uppercase;cursor:pointer}
.btn:hover{background:var(--gold-bright)}
.btn.outline{background:transparent;color:var(--gold);border:1px solid var(--gold-dim)}
.btn.outline:hover{background:rgba(90,192,224,0.08)}
.btn.full{width:100%}
.btn.lg{padding:16px 24px;font-size:14px}
.btn.sm{padding:8px 14px;font-size:11px;letter-spacing:0.1em}
.btn.danger{background:var(--red);color:var(--text)}
.btn.danger.outline{background:transparent;color:var(--red);border-color:var(--red)}
.btn.elite{background:var(--gold-bright);color:var(--bg-deep)}
.form-grid{display:flex;flex-direction:column;gap:16px}
.form-field{display:flex;flex-direction:column;gap:8px}
.form-label{font-size:11px;letter-spacing:0.15em;text-transform:uppercase;color:var(--gold);font-weight:600}
.form-input,.form-textarea,.form-select{background:var(--bg-deep);border:1px solid var(--border);border-radius:3px;padding:12px 14px;color:var(--text);font-family:var(--sans);font-size:15px;width:100%}
.form-input:focus,.form-textarea:focus,.form-select:focus{outline:none;border-color:var(--gold)}
.form-textarea{min-height:70px;resize:vertical}
.yn-group{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.yn-btn{padding:14px;background:var(--bg-deep);border:1px solid var(--border);border-radius:3px;color:var(--text-dim);font-size:13px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;cursor:pointer}
.yn-btn.active{background:var(--gold);color:var(--bg);border-color:var(--gold)}
.yn-btn.no.active{background:var(--red);border-color:var(--red);color:var(--text)}
.scale-group{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.scale-btn{padding:10px 0;background:var(--bg-deep);border:1px solid var(--border);border-radius:3px;color:var(--text-dim);font-family:var(--serif);font-size:14px;font-weight:600;cursor:pointer}
.scale-btn.active{background:var(--gold);color:var(--bg);border-color:var(--gold)}
.scale-1to5{grid-template-columns:repeat(5,1fr)}
.quad-group{display:grid;grid-template-columns:1fr 1fr;gap:6px}
@media(min-width:480px){.quad-group{grid-template-columns:repeat(4,1fr)}}
.quad-btn{padding:10px 8px;background:var(--bg-deep);border:1px solid var(--border);border-radius:3px;color:var(--text-dim);font-size:11px;font-weight:600;cursor:pointer;text-align:center;line-height:1.2}
.quad-btn.active{background:var(--gold);color:var(--bg);border-color:var(--gold)}
.day-card{background:var(--bg-card);border:1px solid var(--border);border-radius:4px;padding:16px;margin-bottom:12px}
.day-card.today{border-color:var(--gold);background:linear-gradient(135deg,var(--bg-card),rgba(90,192,224,0.06))}
.day-header{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;gap:8px}
.day-name{font-family:var(--serif);font-size:18px;font-weight:600;color:var(--text)}
.day-name .today-pill{display:inline-block;background:var(--gold);color:var(--bg);font-size:9px;font-weight:700;letter-spacing:0.2em;padding:3px 8px;border-radius:2px;margin-left:8px}
.day-type{font-size:10px;letter-spacing:0.2em;text-transform:uppercase;color:var(--gold);font-weight:600;text-align:right}
.day-purpose{font-size:12px;font-style:italic;color:var(--text-dim);margin-bottom:10px;line-height:1.4}
.tempo-rir{font-size:10px;letter-spacing:0.15em;color:var(--gold);font-weight:600;padding:6px 10px;background:rgba(90,192,224,0.08);border-radius:3px;display:inline-block;margin-bottom:10px}
.exercise-row{padding:10px 12px;background:var(--bg-deep);border-left:2px solid var(--gold-dim);border-radius:0 3px 3px 0;margin-bottom:6px;cursor:pointer}
.exercise-row:hover{border-left-color:var(--gold);background:var(--bg-card-hover)}
.exercise-row.logged{border-left-color:var(--green)}
.exercise-name{font-size:13px;font-weight:600;color:var(--text);display:flex;justify-content:space-between;gap:8px}
.exercise-last{font-size:10px;color:var(--gold-dim);margin-top:3px}
.set-row{display:grid;grid-template-columns:30px 1fr 1fr 50px;gap:8px;align-items:center;padding:6px 0}
.set-row .set-num{font-family:var(--serif);font-weight:700;color:var(--gold);font-size:14px;text-align:center}
.set-row input{background:var(--bg-deep);border:1px solid var(--border);border-radius:3px;padding:8px;color:var(--text);font-size:14px;text-align:center;width:100%}
.set-row input:focus{outline:none;border-color:var(--gold)}
.set-row .remove{background:transparent;border:none;color:var(--text-faint);font-size:18px;cursor:pointer}
.goal-card,.rock-card{background:var(--bg-card);border:1px solid var(--border);border-radius:4px;padding:14px 16px;margin-bottom:10px}
.goal-card.body{border-left:3px solid var(--green)}
.goal-card.financial{border-left:3px solid var(--gold)}
.goal-card.business{border-left:3px solid #6B8FCB}
.goal-card.brand{border-left:3px solid var(--purple)}
.goal-card.personal{border-left:3px solid var(--amber)}
.goal-card.realestate{border-left:3px solid #7DA8B5}
.goal-card.mind{border-left:3px solid #C97D8E}
.goal-head{display:flex;justify-content:space-between;gap:8px;margin-bottom:6px}
.goal-cat{font-size:9px;letter-spacing:0.25em;text-transform:uppercase;color:var(--text-faint);font-weight:600}
.goal-title{font-family:var(--serif);font-size:16px;font-weight:600;color:var(--text);flex:1;line-height:1.3}
.goal-target{font-family:var(--serif);font-weight:600;color:var(--gold);font-size:14px}
.goal-meta{font-size:12px;color:var(--text-dim);margin-top:4px}
.goal-actions{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.horizon-cascade{display:grid;grid-template-columns:1fr;gap:6px;margin-top:10px;padding:10px;background:var(--bg-deep);border-radius:3px}
@media(min-width:640px){.horizon-cascade{grid-template-columns:1fr 1fr 1fr 1fr}}
.horizon-step{font-size:11px;line-height:1.4}
.horizon-label{font-size:9px;letter-spacing:0.25em;text-transform:uppercase;color:var(--gold);font-weight:600;margin-bottom:3px}
.rock-status{display:inline-block;padding:2px 8px;border-radius:2px;font-size:9px;letter-spacing:0.2em;text-transform:uppercase;font-weight:600}
.rock-status.on-track{background:rgba(91,174,124,0.18);color:var(--green)}
.rock-status.off-track{background:rgba(199,74,58,0.18);color:var(--red)}
.rock-status.done{background:rgba(90,192,224,0.18);color:var(--gold)}
.rock-week-history{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap}
.rock-week-dot{width:14px;height:14px;border-radius:50%;background:var(--bg-deep);border:1px solid var(--border-bright)}
.rock-week-dot.on-track{background:var(--green);border-color:var(--green)}
.rock-week-dot.off-track{background:var(--red);border-color:var(--red)}
.rock-week-dot.done{background:var(--gold);border-color:var(--gold)}
.task-row{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--bg-card);border:1px solid var(--border);border-radius:3px;margin-bottom:6px}
.task-row.done{opacity:0.5}
.task-row.done .task-title{text-decoration:line-through}
.task-row.high{border-left:3px solid var(--red)}
.task-row.med{border-left:3px solid var(--amber)}
.task-row.low{border-left:3px solid var(--text-faint)}
.task-check{width:20px;height:20px;border:1px solid var(--border-bright);border-radius:3px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.task-check.checked{background:var(--gold);border-color:var(--gold)}
.task-check.checked::after{content:"✓";color:var(--bg);font-size:13px;font-weight:700}
.task-content{flex:1}
.task-title{font-size:14px;color:var(--text);font-weight:500}
.task-meta{font-size:10px;color:var(--text-faint);margin-top:2px}
.task-pri{font-size:9px;padding:2px 6px;border-radius:2px;letter-spacing:0.15em;text-transform:uppercase;font-weight:600}
.task-pri.high{background:rgba(199,74,58,0.18);color:var(--red)}
.task-pri.med{background:rgba(224,160,80,0.18);color:var(--amber)}
.task-pri.low{background:rgba(92,100,120,0.18);color:var(--text-dim)}
.scoreboard-row{display:grid;grid-template-columns:1fr 95px 95px 90px;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);font-size:13px}
.scoreboard-row.head{color:var(--text-faint);font-size:9px;letter-spacing:0.2em;text-transform:uppercase;font-weight:600}
.scoreboard-name{color:var(--text)}
.scoreboard-num{font-family:var(--serif);font-weight:600;color:var(--text);text-align:right}
.scoreboard-pace{text-align:right;font-size:10px;letter-spacing:0.2em;text-transform:uppercase;font-weight:700}
.scoreboard-pace.ahead{color:var(--green)}
.scoreboard-pace.behind{color:var(--red)}
.scoreboard-pace.on{color:var(--gold)}
.progress-track{background:var(--bg-deep);border-radius:3px;height:6px;margin-top:6px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--gold-dim),var(--gold));transition:width 0.4s}
.progress-fill.behind{background:linear-gradient(90deg,#8B3A30,var(--red))}
.progress-fill.ahead{background:linear-gradient(90deg,#468062,var(--green))}
.mission-block{background:var(--bg-card);border:1px solid var(--border);border-radius:4px;padding:20px;margin-bottom:14px}
.mission-title{font-family:var(--serif);font-size:15px;font-weight:600;letter-spacing:0.2em;text-transform:uppercase;color:var(--gold);margin-bottom:10px}
.mission-text{font-family:var(--serif);font-size:16px;line-height:1.5;color:var(--text);font-style:italic}
.mission-prose{font-size:14px;line-height:1.6;color:var(--text);margin-bottom:10px}
.value-item{display:flex;align-items:flex-start;gap:10px;padding:10px 0}
.value-name{font-family:var(--serif);font-weight:700;letter-spacing:0.15em;text-transform:uppercase;color:var(--gold);font-size:11px;flex:0 0 110px}
.value-desc{font-size:13px;color:var(--text-dim);flex:1}
.const-nav{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.const-nav button{background:var(--bg-card);border:1px solid var(--border);border-radius:3px;padding:8px 12px;color:var(--text-dim);font-size:10px;font-weight:600;letter-spacing:0.15em;text-transform:uppercase;cursor:pointer}
.const-nav button:hover{color:var(--gold);border-color:var(--gold-dim)}
.affirmation-list{list-style:none;padding:0}
.affirmation-list li{padding:8px 0 8px 18px;position:relative;font-family:var(--serif);font-size:14px;line-height:1.5;color:var(--text);border-bottom:1px dotted var(--border)}
.affirmation-list li::before{content:'⌁';position:absolute;left:0;color:var(--gold);font-weight:700}
.timeline-row{display:grid;grid-template-columns:70px 1fr 100px;gap:12px;padding:10px 0;border-bottom:1px solid var(--border);align-items:center}
.timeline-row:last-child{border-bottom:none}
.timeline-year{font-family:var(--serif);font-weight:700;color:var(--gold);font-size:13px;letter-spacing:0.15em}
.timeline-desc{font-size:13px;color:var(--text)}
.timeline-target{font-family:var(--serif);font-weight:600;color:var(--gold);font-size:14px;text-align:right}
.macro-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.macro-input{background:var(--bg-deep);border:1px solid var(--border);border-radius:3px;padding:10px 8px;text-align:center}
.macro-input label{display:block;font-size:9px;letter-spacing:0.2em;text-transform:uppercase;color:var(--text-faint);font-weight:600;margin-bottom:6px}
.macro-input input{width:100%;background:transparent;border:none;color:var(--text);font-family:var(--serif);font-size:18px;text-align:center;font-weight:600}
.macro-input input:focus{outline:none}
.modal-bg{position:fixed;inset:0;background:rgba(7,9,15,0.85);display:none;align-items:flex-start;justify-content:center;z-index:200;padding:20px;overflow-y:auto}
.modal-bg.show{display:flex}
.modal{background:var(--bg-elev);border:1px solid var(--gold-dim);border-radius:6px;padding:24px;max-width:560px;width:100%;max-height:90vh;overflow-y:auto;margin:auto}
.modal h3{font-family:var(--serif);color:var(--gold);font-size:18px;letter-spacing:0.15em;text-transform:uppercase;margin-bottom:16px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--gold);color:var(--bg);padding:12px 24px;border-radius:3px;font-size:13px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;transition:transform 0.3s;z-index:300}
.toast.show{transform:translateX(-50%) translateY(0)}
.empty{text-align:center;padding:40px 20px;color:var(--text-faint);font-style:italic;font-family:var(--serif)}

.meeting-section-name{font-family:var(--serif);font-size:18px;font-weight:600;color:var(--text)}
.meeting-section-time{font-size:10px;color:var(--text-faint);letter-spacing:0.15em}
.horizon-row{display:grid;grid-template-columns:80px 1fr 1fr 1fr 1fr;gap:8px;padding:10px 0;border-bottom:1px solid var(--border);font-size:12px;align-items:center}
.horizon-row.head{font-size:9px;letter-spacing:0.2em;color:var(--text-faint);font-weight:600;text-transform:uppercase}
.horizon-cat{font-family:var(--serif);font-weight:700;color:var(--gold);font-size:11px;letter-spacing:0.15em;text-transform:uppercase}

.horizon-cell.empty{color:var(--text-faint);font-style:italic}
.accountability-role{background:var(--bg-card);border:1px solid var(--border);border-radius:4px;padding:14px 16px;margin-bottom:10px}
.accountability-role h4{font-family:var(--serif);color:var(--gold);font-size:14px;letter-spacing:0.15em;text-transform:uppercase;margin-bottom:6px}
.accountability-role p{font-size:13px;color:var(--text-dim)}
.circle-row{display:grid;grid-template-columns:1fr 50px 50px 50px 50px;gap:6px;padding:8px 0;align-items:center;border-bottom:1px solid var(--border)}
.circle-row.head{font-size:9px;letter-spacing:0.15em;color:var(--text-faint);font-weight:600;text-transform:uppercase}

.history-row{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;background:var(--bg-card);border:1px solid var(--border);border-radius:3px;margin-bottom:6px}
.history-date{font-family:var(--serif);font-size:14px;font-weight:600;color:var(--text)}
.history-score{font-family:var(--serif);font-size:18px;font-weight:700;color:var(--gold)}
.hyrox-banner{background:linear-gradient(135deg,rgba(155,127,201,0.15),rgba(155,127,201,0.05));border:1px solid var(--purple);border-radius:4px;padding:14px;margin-bottom:14px}
.hyrox-banner-title{font-family:var(--serif);color:var(--purple);font-size:13px;letter-spacing:0.2em;text-transform:uppercase;font-weight:700;margin-bottom:6px}
.vision-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:640px){.vision-grid{grid-template-columns:repeat(3,1fr)}}

.vision-tile{background:var(--bg-card);border:1px solid var(--border);border-radius:6px;overflow:hidden;position:relative;cursor:pointer;transition:all 0.2s}

.vision-tile-cat{position:absolute;top:6px;left:6px;background:rgba(7,9,15,0.85);color:var(--gold);font-size:8px;letter-spacing:0.2em;font-weight:700;padding:3px 7px;border-radius:2px;text-transform:uppercase;backdrop-filter:blur(4px)}
.vision-tile-status{position:absolute;top:6px;right:6px;background:rgba(7,9,15,0.85);font-size:8px;letter-spacing:0.15em;font-weight:700;padding:3px 7px;border-radius:2px;text-transform:uppercase;backdrop-filter:blur(4px)}

.vision-tile-target{font-size:10px;color:var(--text-faint);letter-spacing:0.1em}
.faith-block{background:var(--bg-card);border:1px solid var(--border);border-radius:4px;padding:18px;margin-bottom:14px}
.faith-anchor{background:linear-gradient(135deg,rgba(90,192,224,0.12),rgba(90,192,224,0.03));border:1px solid var(--gold-dim);border-radius:4px;padding:24px;margin-bottom:14px;text-align:center}
.faith-anchor-verse{font-family:var(--serif);font-size:20px;font-style:italic;color:var(--text);line-height:1.5;margin-bottom:8px}

.faith-tabs button.active{background:var(--gold);color:var(--bg);border-color:var(--gold)}

// ============ HELPERS ============
function todayStr(){const d=new Date();return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function getWeekKey(date=new Date()){const d=new Date(date);d.setHours(0,0,0,0);d.setDate(d.getDate()+4-(d.getDay()||7));const ys=new Date(d.getFullYear(),0,1);const wk=Math.ceil((((d-ys)/86400000)+1)/7);return`${d.getFullYear()}-W${String(wk).padStart(2,'0')}`}
function daysBetween(a,b){return Math.floor((b-a)/86400000)}
function getDaysToRace(){if(!store.raceDate)return 0;return Math.max(0,daysBetween(new Date(),new Date(store.raceDate)))}
function getDaysToQuarterEnd(){if(!store.quarterEnd)return 0;return Math.max(0,daysBetween(new Date(),new Date(store.quarterEnd)))}
function getCurrentPhase(){if(!store.startDate||!store.raceDate)return{name:"—"};const t=new Date(),s=new Date(store.startDate),r=new Date(store.raceDate);if(t<s)return{name:"PREP STARTING"};if(t>r)return{name:"POST-RACE"};const p=daysBetween(s,t)/daysBetween(s,r);if(p<0.33)return{name:"BASE BUILD"};if(p<0.66)return{name:"STRENGTH-COND"};if(p<0.92)return{name:"SPECIFIC PREP"};if(p<0.97)return{name:"TAPER"};return{name:"RACE WEEK"}}
function fmt$(n){if(n==null||isNaN(n))return"—";if(n>=1000000)return"$"+(n/1000000).toFixed(n>=10000000?0:1)+"M";if(n>=1000)return"$"+(n/1000).toFixed(0)+"K";return"$"+n.toLocaleString()}

const dates=Object.keys(store.meeting||{}).sort().reverse();const el=document.getElementById('lastMeetingSummary');if(!dates.length){el.innerHTML=`<div class="empty">No meeting yet.</div>`;return}const r=store.meeting[dates[0]];const dom=store.domainNames;const ov=dom.length&&r.scores?(dom.reduce((s,d)=>s+(r.scores[d.toLowerCase()]||0),0)/dom.length).toFixed(1):0;el.innerHTML=`<div style="font-family:var(--serif);font-size:14px;color:var(--gold);letter-spacing:0.15em;margin-bottom:10px">${new Date(dates[0]).toLocaleDateString('en-US',{weekday:'long',month:'short',day:'numeric'})}</div><div style="font-family:var(--serif);font-size:32px;font-weight:700;color:var(--gold);text-align:center;margin-bottom:14px">${ov}<span style="font-size:14px;color:var(--text-faint)">/10 OVERALL</span></div>${r.segueWin?`<div style="margin-bottom:8px"><div style="font-size:9px;letter-spacing:0.2em;color:var(--gold);font-weight:600">SEGUE WIN</div><div style="font-size:14px">${escapeHTML(r.segueWin)}</div></div>`:''}${r.nextWeek?`<div><div style="font-size:9px;letter-spacing:0.2em;color:var(--gold);font-weight:600">NEXT WEEK</div><div style="font-size:14px">${escapeHTML(r.nextWeek)}</div></div>`:''}${r.meetingRating?`<div style="margin-top:10px"><div style="font-size:9px;letter-spacing:0.2em;color:var(--gold);font-weight:600">MEETING RATING</div><div style="font-size:18px;font-family:var(--serif);font-weight:700">${r.meetingRating}/10</div></div>`:''}`}

window.openLifeOpMeeting=()=>{document.querySelector('[data-view="forms"]').click();setTimeout(renderLifeOpMeetingForm,100)};

function renderLifeOpMeetingForm(){const today=todayStr();const existing=store.meeting[today]||{scores:{},rockChecks:{},taskUpdates:{},financialUpdates:{},issues:[]};const dom=store.domainNames;const activeRocks=(store.rocks||[]).filter(r=>r.status!=='done');const openTasks=(store.tasks||[]).filter(t=>!t.done);
const scoresHTML=dom.map(d=>`<div class="form-field"><div class="form-label">${d} (1-10)</div><div class="scale-group">${Array.from({length:10},(_,i)=>i+1).map(n=>`<button type="button" class="scale-btn ${existing.scores[d.toLowerCase()]===n?'active':''}" data-domain="${d.toLowerCase()}" data-val="${n}">${n}</button>`).join('')}</div></div>`).join('');
const finHTML=store.financial.targets.map(t=>{const wk=getWeekKey();const ew=(store.financial.weekly[wk]||{})[t.id]||'';return`<div class="form-field" style="display:grid;grid-template-columns:1fr 130px;gap:10px;align-items:end"><div><div class="form-label">${escapeHTML(t.name)}</div><div style="font-size:11px;color:var(--text-faint)">YTD: ${fmt$(t.current)} / ${fmt$(t.annual)}</div></div><input type="number" class="form-input" data-fin="${t.id}" placeholder="$ this week" value="${ew}"></div>`}).join('');
const rocksHTML=activeRocks.length?activeRocks.map(r=>{const cur=existing.rockChecks[r.id]||'';return`<div class="form-field"><div class="form-label">${escapeHTML(r.title.slice(0,70))}</div><div class="quad-group"><button type="button" class="quad-btn ${cur==='on-track'?'active':''}" data-rk="${r.id}" data-val="on-track">ON TRACK</button><button type="button" class="quad-btn ${cur==='off-track'?'active':''}" data-rk="${r.id}" data-val="off-track">OFF TRACK</button><button type="button" class="quad-btn ${cur==='done'?'active':''}" data-rk="${r.id}" data-val="done">DONE</button></div></div>`}).join(''):`<div class="empty" style="padding:20px 0">No active rocks.</div>`;
const todoHTML=openTasks.length?openTasks.slice(0,15).map(t=>{const cur=existing.taskUpdates[t.id];return`<div class="form-field" style="display:grid;grid-template-columns:1fr 100px;gap:10px;align-items:end"><div><div class="form-label">${escapeHTML(t.title.slice(0,60))}</div><div style="font-size:10px;color:var(--text-faint)">${(t.priority||'med').toUpperCase()}${t.due?' · Due '+new Date(t.due).toLocaleDateString('en-US',{month:'short',day:'numeric'}):''}</div></div><div class="yn-group" style="grid-template-columns:1fr"><button type="button" class="yn-btn ${cur===true?'active':''}" data-tk="${t.id}">DONE</button></div></div>`}).join(''):`<div class="empty" style="padding:20px 0">No open tasks.</div>`;

document.querySelectorAll('.scale-btn[data-domain]').forEach(b=>b.addEventListener('click',()=>{const d=b.dataset.domain;document.querySelectorAll(`.scale-btn[data-domain="${d}"]`).forEach(x=>x.classList.remove('active'));b.classList.add('active')}));
document.querySelectorAll('.scale-btn[data-mtg]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('[data-mtg="rating"]').forEach(x=>x.classList.remove('active'));b.classList.add('active')}));
document.querySelectorAll('.quad-btn[data-rk]').forEach(b=>b.addEventListener('click',()=>{const rk=b.dataset.rk;document.querySelectorAll(`.quad-btn[data-rk="${rk}"]`).forEach(x=>x.classList.remove('active'));b.classList.add('active')}));
document.querySelectorAll('.yn-btn[data-tk]').forEach(b=>b.addEventListener('click',()=>{b.classList.toggle('active')}))}

window.saveLifeOpMeeting=()=>{const today=todayStr();const wk=getWeekKey();const data={date:today,scores:{},rockChecks:{},taskUpdates:{},financialUpdates:{},issues:[]};store.domainNames.forEach(d=>{const a=document.querySelector(`.scale-btn[data-domain="${d.toLowerCase()}"].active`);data.scores[d.toLowerCase()]=a?parseInt(a.dataset.val):0});document.querySelectorAll('.quad-btn[data-rk].active').forEach(b=>{const rk=b.dataset.rk;const s=b.dataset.val;data.rockChecks[rk]=s;const r=store.rocks.find(x=>x.id===rk);if(r){if(!r.weeklyChecks)r.weeklyChecks=[];r.weeklyChecks=r.weeklyChecks.filter(c=>c.week!==wk);r.weeklyChecks.push({week:wk,status:s,note:''});r.status=s}});document.querySelectorAll('.yn-btn[data-tk].active').forEach(b=>{const tk=b.dataset.tk;const t=store.tasks.find(x=>x.id===tk);if(t){t.done=true;t.completedAt=new Date().toISOString()}data.taskUpdates[tk]=true});if(!store.financial.weekly[wk])store.financial.weekly[wk]={};document.querySelectorAll('[data-fin]').forEach(input=>{const tid=input.dataset.fin;const val=parseFloat(input.value);if(!isNaN(val)&&val>=0){const prev=store.financial.weekly[wk][tid]||0;const diff=val-prev;store.financial.weekly[wk][tid]=val;data.financialUpdates[tid]=val;const t=store.financial.targets.find(x=>x.id===tid);if(t)t.current=(t.current||0)+diff}});data.issues=[{identify:document.getElementById('iss1id').value,solution:document.getElementById('iss1sol').value},{identify:document.getElementById('iss2id').value,solution:document.getElementById('iss2sol').value},{identify:document.getElementById('iss3id').value,solution:document.getElementById('iss3sol').value}].filter(i=>i.identify);data.segueWin=document.getElementById('meetSegueWin').value;data.headlines=document.getElementById('meetHeadlines').value;data.nextWeek=document.getElementById('meetNextWeek').value;data.win=document.getElementById('meetWin').value;data.correction=document.getElementById('meetCorrection').value;data.eliminate=document.getElementById('meetEliminate').value;const rt=document.querySelector('[data-mtg="rating"].active');data.meetingRating=rt?parseInt(rt.dataset.val):null;store.meeting[today]=data;
// Auto-create sprint tasks from Top 3 commitments
const nextWk=getWeekKey(new Date(Date.now()+7*86400000));const commitLines=(data.nextWeek||'').split('\n').map(l=>l.trim()).filter(l=>l).slice(0,3);if(commitLines.length){if(!store.tasks)store.tasks=[];commitLines.forEach((line,i)=>{const exists=store.tasks.find(t=>t.sprintWeek===nextWk&&t.title===line);if(!exists){store.tasks.push({id:'t_'+Date.now().toString(36)+'_'+i,title:line,priority:'high',rockId:null,due:null,notes:'Auto-created from Life Op Meeting · Sprint Top 3',done:false,sprintWeek:nextWk,createdAt:new Date().toISOString()})}})}saveAll();showToast("MEETING SAVED · TOP 3 → TASKS");setTimeout(()=>document.querySelector('[data-view="home"]').click(),900)};

// ============ GOALS ============
function renderGoals(){document.getElementById('goalsContent').innerHTML=`<div class="section"><div class="section-label"><span>Annual Goals</span><span class="meta">${(store.goals||[]).length} active</span></div><div class="goal-actions" style="margin-bottom:10px"><button class="btn outline sm" onclick="addGoal()">+ ADD GOAL</button></div><div id="goalsList"></div></div>`;const el=document.getElementById('goalsList');if(!(store.goals||[]).length){el.innerHTML=`<div class="empty">No goals. Tap + ADD GOAL.</div>`;return}el.innerHTML=store.goals.map(g=>goalCardHTML(g)).join('')}
function goalCardHTML(g){const lr=(store.rocks||[]).filter(r=>r.goalId===g.id);const dr=lr.filter(r=>r.status==='done').length;const milestones=(g.target_90d||g.target_365d)?`<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px;padding:8px;background:rgba(90,192,224,0.06);border:1px solid var(--gold-dim);border-radius:3px"><div style="font-size:11px"><div style="font-size:9px;letter-spacing:0.2em;color:var(--gold);font-weight:600;margin-bottom:2px">90-DAY</div>${escapeHTML(g.target_90d||'—')}</div><div style="font-size:11px"><div style="font-size:9px;letter-spacing:0.2em;color:var(--gold);font-weight:600;margin-bottom:2px">365-DAY</div>${escapeHTML(g.target_365d||'—')}</div></div>`:'';return`<div class="goal-card ${g.category}"><div class="goal-head"><div><div class="goal-cat">${g.category}</div><div class="goal-title">${escapeHTML(g.title)}</div></div><div class="goal-target">${escapeHTML(g.target_1y||'')}</div></div>${milestones}<div class="horizon-cascade"><div class="horizon-step"><div class="horizon-label">1 YR</div>${escapeHTML(g.target_1y||'—')}</div><div class="horizon-step"><div class="horizon-label">3 YR</div>${escapeHTML(g.target_3y||'—')}</div><div class="horizon-step"><div class="horizon-label">5 YR</div>${escapeHTML(g.target_5y||'—')}</div><div class="horizon-step"><div class="horizon-label">10 YR</div>${escapeHTML(g.target_10y||'—')}</div></div>${g.measurable?`<div class="goal-meta">Measurable: ${escapeHTML(g.measurable)}</div>`:''}<div class="goal-meta">${lr.length} rocks · ${dr} done</div><div class="goal-actions"><button class="btn outline sm" onclick="editGoal('${g.id}')">EDIT</button><button class="btn danger outline sm" onclick="deleteGoal('${g.id}')">DELETE</button></div></div>`}
window.addGoal=()=>{openModal(`<h3>Add Goal — Force the Cascade</h3><p style="color:var(--text-dim);font-size:12px;margin-bottom:14px">90d → 1yr → 3yr → 5yr → 10yr. Each link traces.</p><div class="form-grid"><div class="form-field"><div class="form-label">Category</div><select class="form-select" id="goalCat">${GOAL_CATEGORIES.map(c=>`<option value="${c}">${c.toUpperCase()}</option>`).join('')}</select></div><div class="form-field"><div class="form-label">Title</div><input type="text" class="form-input" id="goalTitle"></div><div class="form-field"><div class="form-label">90-DAY MILESTONE</div><input type="text" class="form-input" id="goal90" placeholder="What's done in 90 days"></div><div class="form-field"><div class="form-label">365-DAY MILESTONE</div><input type="text" class="form-input" id="goal365" placeholder="What's done by year-end"></div><div class="form-field"><div class="form-label">1-YEAR TARGET</div><input type="text" class="form-input" id="goal1y"></div><div class="form-field"><div class="form-label">3-YEAR TARGET</div><input type="text" class="form-input" id="goal3y"></div><div class="form-field"><div class="form-label">5-YEAR TARGET</div><input type="text" class="form-input" id="goal5y"></div><div class="form-field"><div class="form-label">10-YEAR TARGET</div><input type="text" class="form-input" id="goal10y"></div><div class="form-field"><div class="form-label">Measurable — how you'll know</div><input type="text" class="form-input" id="goalMeas"></div><div class="form-field"><div class="form-label">🎁 REWARD when achieved</div><input type="text" class="form-input" id="goalReward" placeholder="What you'll do/have to celebrate (weekend at cabin, new watch, steak dinner...)"></div><button class="btn full" onclick="saveNewGoal()">SAVE</button><button class="btn full outline" onclick="closeModal()">CANCEL</button></div>`)};
window.saveNewGoal=()=>{const g={id:'g_'+Date.now().toString(36),category:document.getElementById('goalCat').value,title:document.getElementById('goalTitle').value,target_90d:document.getElementById('goal90').value,target_365d:document.getElementById('goal365').value,target_1y:document.getElementById('goal1y').value,target_3y:document.getElementById('goal3y').value,target_5y:document.getElementById('goal5y').value,target_10y:document.getElementById('goal10y').value,measurable:document.getElementById('goalMeas').value,reward:(document.getElementById('goalReward')||{}).value||''};if(!g.title){alert("Title required");return}if(!store.goals)store.goals=[];store.goals.push(g);saveAll();closeModal();renderGoals();showToast("GOAL ADDED")};
window.editGoal=(id)=>{const g=store.goals.find(x=>x.id===id);if(!g)return;openModal(`<h3>Edit Goal</h3><div class="form-grid"><div class="form-field"><div class="form-label">Category</div><select class="form-select" id="goalCat">${GOAL_CATEGORIES.map(c=>`<option value="${c}" ${c===g.category?'selected':''}>${c.toUpperCase()}</option>`).join('')}</select></div><div class="form-field"><div class="form-label">Title</div><input type="text" class="form-input" id="goalTitle" value="${escapeHTML(g.title)}"></div><div class="form-field"><div class="form-label">90-DAY</div><input type="text" class="form-input" id="goal90" value="${escapeHTML(g.target_90d||'')}"></div><div class="form-field"><div class="form-label">365-DAY</div><input type="text" class="form-input" id="goal365" value="${escapeHTML(g.target_365d||'')}"></div><div class="form-field"><div class="form-label">1-YEAR</div><input type="text" class="form-input" id="goal1y" value="${escapeHTML(g.target_1y||'')}"></div><div class="form-field"><div class="form-label">3-YEAR</div><input type="text" class="form-input" id="goal3y" value="${escapeHTML(g.target_3y||'')}"></div><div class="form-field"><div class="form-label">5-YEAR</div><input type="text" class="form-input" id="goal5y" value="${escapeHTML(g.target_5y||'')}"></div><div class="form-field"><div class="form-label">10-YEAR</div><input type="text" class="form-input" id="goal10y" value="${escapeHTML(g.target_10y||'')}"></div><div class="form-field"><div class="form-label">Measurable — how you'll know</div><input type="text" class="form-input" id="goalMeas" value="${escapeHTML(g.measurable||'')}"></div><div class="form-field"><div class="form-label">🎁 REWARD when achieved</div><input type="text" class="form-input" id="goalReward" placeholder="What you'll do/have to celebrate" value="${escapeHTML(g.reward||'')}"></div><button class="btn full" onclick="saveEditGoal('${id}')">SAVE</button><button class="btn full outline" onclick="closeModal()">CANCEL</button></div>`)};
window.saveEditGoal=(id)=>{const g=store.goals.find(x=>x.id===id);if(!g)return;g.category=document.getElementById('goalCat').value;g.title=document.getElementById('goalTitle').value;g.target_90d=document.getElementById('goal90').value;g.target_365d=document.getElementById('goal365').value;g.target_1y=document.getElementById('goal1y').value;g.target_3y=document.getElementById('goal3y').value;g.target_5y=document.getElementById('goal5y').value;g.target_10y=document.getElementById('goal10y').value;g.measurable=document.getElementById('goalMeas').value;const rEl=document.getElementById('goalReward');if(rEl)g.reward=rEl.value;saveAll();closeModal();renderGoals();showToast("UPDATED")};

${done.length?`<div class="section"><div class="section-label"><span style="color:var(--green)">✓ DONE</span><span class="meta">${done.length}</span></div><div class="card" style="opacity:0.6">${done.slice(-10).reverse().map(t=>taskRowHTML(t)).join('')}</div></div>`:''}
${all.length===0?`<div class="empty">No tasks yet. Run a Life Op Meeting and the Top 3 commitments auto-create sprint tasks.</div>`:''}
`}

window.exportTasksICS=()=>{const tasks=(store.tasks||[]).filter(t=>!t.done&&t.due);if(!tasks.length){alert("No tasks with due dates to export. Add due dates first.");return}const lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Life OS//EN','CALSCALE:GREGORIAN','METHOD:PUBLISH'];tasks.forEach(t=>{const due=new Date(t.due);const dt=due.toISOString().replace(/[-:]/g,'').split('.')[0]+'Z';const dtEnd=new Date(due.getTime()+30*60000).toISOString().replace(/[-:]/g,'').split('.')[0]+'Z';const uid=t.id+'@lifeos';const summary=(t.sprintWeek?'[SPRINT] ':'')+t.title.replace(/[\n\r,;]/g,' ');const desc=(t.notes||'').replace(/[\n\r,;]/g,' ');lines.push('BEGIN:VEVENT');lines.push('UID:'+uid);lines.push('DTSTAMP:'+new Date().toISOString().replace(/[-:]/g,'').split('.')[0]+'Z');lines.push('DTSTART:'+dt);lines.push('DTEND:'+dtEnd);lines.push('SUMMARY:'+summary);if(desc)lines.push('DESCRIPTION:'+desc);lines.push('PRIORITY:'+(t.priority==='high'?'1':t.priority==='med'?'5':'9'));lines.push('END:VEVENT')});lines.push('END:VCALENDAR');const blob=new Blob([lines.join('\r\n')],{type:'text/calendar'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='life-os-tasks.ics';a.click();URL.revokeObjectURL(url);showToast(`EXPORTED ${tasks.length} TASKS`)};

function renderFinancial(){document.getElementById('financialContent').innerHTML=`<div class="section"><div class="section-label"><span>Business Revenue · Annual</span><span class="meta" id="finMeta">—</span></div><div class="goal-actions" style="margin-bottom:10px"><button class="btn outline sm" onclick="editFinancialTargets()">EDIT TARGETS</button> <button class="btn outline sm" onclick="logFinancialWeek()">+ LOG WEEK</button></div><div id="financialScoreboard"></div></div><div class="section"><div class="section-label"><span>Weekly Contributions</span><span class="meta" id="contribMeta">—</span></div><div class="goal-actions" style="margin-bottom:10px"><button class="btn outline sm" onclick="editContribTargets()">EDIT TARGETS</button> <button class="btn outline sm" onclick="logContribWeek()">+ LOG WEEK</button></div><div id="contribScoreboard"></div></div><div class="section"><div class="section-label"><span>Magic Numbers</span></div><div class="card"><div class="timeline-row"><div class="timeline-year">Y1</div><div class="timeline-desc">Cash that first check</div><div class="timeline-target">$1M</div></div><div class="timeline-row"><div class="timeline-year">Y3</div><div class="timeline-desc">System working</div><div class="timeline-target">$7M</div></div><div class="timeline-row"><div class="timeline-year">Y5</div><div class="timeline-desc">Ecosystem live</div><div class="timeline-target">$50M</div></div><div class="timeline-row"><div class="timeline-year">Y10</div><div class="timeline-desc">Service at scale</div><div class="timeline-target">$1B</div></div></div></div>`;
const fy=new Date().getFullYear();const doy=Math.floor((new Date()-new Date(fy,0,0))/86400000);const yp=doy/365;const ta=store.financial.targets.reduce((s,t)=>s+(t.annual||0),0);const tc=store.financial.targets.reduce((s,t)=>s+(t.current||0),0);document.getElementById('finMeta').textContent=`${fmt$(tc)} / ${fmt$(ta)} · Year ${Math.round(yp*100)}% in`;let html=`<div class="card"><div class="scoreboard-row head"><div>Target</div><div style="text-align:right">Annual</div><div style="text-align:right">YTD</div><div style="text-align:right">Pace</div></div>`;store.financial.targets.forEach(t=>{const p=t.annual>0?(t.current/t.annual):0;const pa=p-yp;const pc=pa>0.05?'ahead':pa<-0.05?'behind':'on';const pl=pa>0.05?'AHEAD':pa<-0.05?'BEHIND':'ON PACE';html+=`<div class="scoreboard-row"><div class="scoreboard-name">${escapeHTML(t.name)}<div class="progress-track"><div class="progress-fill ${pc==='ahead'?'ahead':pc==='behind'?'behind':''}" style="width:${Math.min(p*100,100)}%"></div></div></div><div class="scoreboard-num">${fmt$(t.annual)}</div><div class="scoreboard-num">${fmt$(t.current)}</div><div class="scoreboard-pace ${pc}">${pl}</div></div>`});const tp=ta>0?tc/ta:0;const tpa=tp-yp;const tpc=tpa>0.05?'ahead':tpa<-0.05?'behind':'on';html+=`<div class="scoreboard-row" style="border-top:1px solid var(--gold-dim);margin-top:6px;padding-top:14px;font-weight:700"><div class="scoreboard-name" style="color:var(--gold);font-family:var(--serif);font-size:15px">TOTAL</div><div class="scoreboard-num" style="color:var(--gold)">${fmt$(ta)}</div><div class="scoreboard-num" style="color:var(--gold)">${fmt$(tc)}</div><div class="scoreboard-pace ${tpc}">${Math.round(tp*100)}%</div></div></div>`;document.getElementById('financialScoreboard').innerHTML=html;

const wcTargets=(store.weeklyContributions&&store.weeklyContributions.targets)||[];const weeksElapsed=Math.ceil(doy/7);const totalWeeklyTarget=wcTargets.reduce((s,t)=>s+(t.weekly||0),0);const totalAnnualContrib=totalWeeklyTarget*52;const totalYtdContrib=wcTargets.reduce((s,t)=>s+(t.ytd||0),0);document.getElementById('contribMeta').textContent=`${fmt$(totalYtdContrib)} / ${fmt$(totalAnnualContrib)}/yr · Wk ${weeksElapsed}`;let chtml=`<div class="card"><div class="scoreboard-row head"><div>Account</div><div style="text-align:right">Weekly</div><div style="text-align:right">YTD</div><div style="text-align:right">Pace</div></div>`;wcTargets.forEach(t=>{const expectedYtd=(t.weekly||0)*weeksElapsed;const p=expectedYtd>0?(t.ytd/expectedYtd):0;const pa=p-1;const pc=pa>0.05?'ahead':pa<-0.05?'behind':'on';const pl=pa>0.05?'AHEAD':pa<-0.05?'BEHIND':'ON PACE';chtml+=`<div class="scoreboard-row"><div class="scoreboard-name">${escapeHTML(t.name)}<div class="progress-track"><div class="progress-fill ${pc==='ahead'?'ahead':pc==='behind'?'behind':''}" style="width:${Math.min(p*100,100)}%"></div></div></div><div class="scoreboard-num">${fmt$(t.weekly)}</div><div class="scoreboard-num">${fmt$(t.ytd)}</div><div class="scoreboard-pace ${pc}">${pl}</div></div>`});const cExpYtd=totalWeeklyTarget*weeksElapsed;const cp=cExpYtd>0?totalYtdContrib/cExpYtd:0;const cpa=cp-1;const cpc=cpa>0.05?'ahead':cpa<-0.05?'behind':'on';chtml+=`<div class="scoreboard-row" style="border-top:1px solid var(--gold-dim);margin-top:6px;padding-top:14px;font-weight:700"><div class="scoreboard-name" style="color:var(--gold);font-family:var(--serif);font-size:15px">TOTAL</div><div class="scoreboard-num" style="color:var(--gold)">${fmt$(totalWeeklyTarget)}</div><div class="scoreboard-num" style="color:var(--gold)">${fmt$(totalYtdContrib)}</div><div class="scoreboard-pace ${cpc}">${Math.round(cp*100)}%</div></div></div>`;document.getElementById('contribScoreboard').innerHTML=chtml}

function normalizeImageUrl(url){if(!url)return'';url=url.trim();
// Google Drive share link: extract FILEID and use googleusercontent direct format
let m=url.match(/drive\.google\.com\/file\/d\/([a-zA-Z0-9_-]+)/);if(m)return`https://lh3.googleusercontent.com/d/${m[1]}=w800`;
m=url.match(/drive\.google\.com\/open\?id=([a-zA-Z0-9_-]+)/);if(m)return`https://lh3.googleusercontent.com/d/${m[1]}=w800`;
m=url.match(/drive\.google\.com\/uc\?(?:export=view&)?id=([a-zA-Z0-9_-]+)/);if(m)return`https://lh3.googleusercontent.com/d/${m[1]}=w800`;
// Google Photos share — sadly no reliable embed format; return as-is
// Dropbox share link — convert to direct
m=url.match(/dropbox\.com\/s\/([a-zA-Z0-9]+)\/(.+?)(\?.+)?$/);if(m)return`https://dl.dropboxusercontent.com/s/${m[1]}/${m[2]}`;
return url}

function renderVision(){if(!store.visionBoard)store.visionBoard=[];const items=store.visionBoard;const total=items.length;const inMotion=items.filter(i=>i.status==='in-motion').length;const manifest=items.filter(i=>i.status==='manifest').length;
document.getElementById('visionContent').innerHTML=`<div class="section"><div class="section-label"><span>Vision Board</span><span class="meta">${total} visions · ${inMotion} in motion · ${manifest} manifest</span></div><div class="card"><p style="color:var(--text-dim);font-size:13px;margin-bottom:12px;line-height:1.5">Paste image URLs (Google Drive share link, Instagram, anything public). Tap a tile to edit or add a description-only vision without a photo.</p><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" onclick="addVisionItem()">+ ADD VISION</button><button class="btn outline" onclick="visionHowTo()">HOW TO USE PHOTO URLS</button></div></div></div><div class="section"><div id="visionGrid"></div></div>`;
const grid=document.getElementById('visionGrid');if(!items.length){grid.innerHTML=`<div class="empty">Empty board. Tap + ADD VISION to start.</div>`;return}grid.innerHTML=`<div class="vision-grid">${items.map(it=>{const imgSrc=normalizeImageUrl(it.imageUrl);const imgHTML=imgSrc?`<img class="vision-tile-img" src="${escapeHTML(imgSrc)}" referrerpolicy="no-referrer" onerror="this.outerHTML='<div class=\\'vision-tile-noimg\\'>⌁</div>'" alt="">`:`<div class="vision-tile-noimg">${escapeHTML((it.category||'V').charAt(0).toUpperCase())}</div>`;return`<div class="vision-tile" onclick="editVisionItem('${it.id}')"><div class="vision-tile-cat">${escapeHTML(it.category||'vision')}</div><div class="vision-tile-status ${it.status||'dreaming'}">${(it.status||'dreaming').replace('-',' ')}</div>${imgHTML}<div class="vision-tile-body"><div class="vision-tile-title">${escapeHTML(it.title||'Untitled')}</div>${it.targetDate?`<div class="vision-tile-target">${new Date(it.targetDate).toLocaleDateString('en-US',{month:'short',year:'numeric'})}</div>`:''}</div></div>`}).join('')}</div>`}

window.visionHowTo=()=>{openModal(`<h3>How to add photos</h3><div style="font-size:13px;line-height:1.7;color:var(--text)"><p style="margin-bottom:12px"><strong style="color:var(--gold)">Option 1: Google Drive (easiest)</strong></p><p style="margin-bottom:6px">1. Upload photo to Google Drive</p><p style="margin-bottom:6px">2. Right-click the photo → Share → Anyone with link</p><p style="margin-bottom:6px">3. Copy the share link</p><p style="margin-bottom:6px">4. Paste it in the Photo URL field</p><p style="margin-bottom:16px;color:var(--green);font-size:12px;background:rgba(91,174,124,0.1);padding:8px 10px;border-radius:3px;border:1px solid var(--green)"><strong>v5 update:</strong> the app now auto-converts the share URL format for you. Just paste and save.</p><p style="margin-bottom:12px"><strong style="color:var(--gold)">Option 2: Direct image URL</strong></p><p style="margin-bottom:6px">Right-click any image online → Copy Image Address → paste.</p><p style="margin-bottom:16px;color:var(--text-dim);font-size:12px">Must be public. Instagram private accounts won't work.</p><p style="margin-bottom:12px"><strong style="color:var(--gold)">Option 3: Dropbox</strong></p><p style="margin-bottom:6px">Paste the share link. Auto-converts.</p><p style="margin-bottom:16px"><strong style="color:var(--gold)">Option 4: Text-only vision</strong></p><p>Leave URL blank. Tile shows your category initial in gold.</p></div><button class="btn full" style="margin-top:14px" onclick="closeModal()">GOT IT</button>`)};

window.addVisionItem=()=>{const cats=['body','wealth','family','home','travel','spiritual','professional','adventure','legacy'];openModal(`<h3>Add Vision</h3><div class="form-grid"><div class="form-field"><div class="form-label">Title (what you see)</div><input type="text" class="form-input" id="vTitle" placeholder="e.g., Standing on Mt Rainier summit" autofocus></div><div class="form-field"><div class="form-label">Photo URL (optional)</div><input type="text" class="form-input" id="vImg" placeholder="https://..."></div><div class="form-field"><div class="form-label">Category</div><select class="form-select" id="vCat">${cats.map(c=>`<option value="${c}">${c.toUpperCase()}</option>`).join('')}</select></div><div class="form-field"><div class="form-label">Target Date (optional)</div><input type="date" class="form-input" id="vDate"></div><div class="form-field"><div class="form-label">Status</div><div class="quad-group" style="grid-template-columns:1fr 1fr 1fr"><button type="button" class="quad-btn active" data-vs="dreaming">DREAMING</button><button type="button" class="quad-btn" data-vs="in-motion">IN MOTION</button><button type="button" class="quad-btn" data-vs="manifest">MANIFEST</button></div></div><div class="form-field"><div class="form-label">Description / Why</div><textarea class="form-textarea" id="vDesc" placeholder="Write the future as if it exists. Sensory detail."></textarea></div><button class="btn full" onclick="saveNewVisionItem()">SAVE</button><button class="btn full outline" onclick="closeModal()">CANCEL</button></div>`);document.querySelectorAll('[data-vs]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('[data-vs]').forEach(x=>x.classList.remove('active'));b.classList.add('active')}))};

window.saveNewVisionItem=()=>{const title=document.getElementById('vTitle').value;if(!title){alert("Title required");return}const status=document.querySelector('[data-vs].active');if(!store.visionBoard)store.visionBoard=[];store.visionBoard.push({id:'v_'+Date.now().toString(36),title,imageUrl:document.getElementById('vImg').value,category:document.getElementById('vCat').value,targetDate:document.getElementById('vDate').value||null,status:status?status.dataset.vs:'dreaming',description:document.getElementById('vDesc').value,createdAt:new Date().toISOString()});saveAll();closeModal();renderVision();showToast("VISION ADDED")};

window.editVisionItem=(id)=>{const it=store.visionBoard.find(x=>x.id===id);if(!it)return;const imgSrc=normalizeImageUrl(it.imageUrl);const cats=['body','wealth','family','home','travel','spiritual','professional','adventure','legacy'];const statuses=['dreaming','in-motion','manifest'];openModal(`<h3>Edit Vision</h3><div class="form-grid"><div class="form-field"><div class="form-label">Title</div><input type="text" class="form-input" id="vTitle" value="${escapeHTML(it.title)}"></div><div class="form-field"><div class="form-label">Photo URL</div><input type="text" class="form-input" id="vImg" value="${escapeHTML(it.imageUrl||'')}"></div>${imgSrc?`<div style="text-align:center"><img src="${escapeHTML(imgSrc)}" referrerpolicy="no-referrer" style="max-width:200px;max-height:200px;border-radius:4px;border:1px solid var(--border)" onerror="this.style.display='none'"></div>`:''}<div class="form-field"><div class="form-label">Category</div><select class="form-select" id="vCat">${cats.map(c=>`<option value="${c}" ${c===it.category?'selected':''}>${c.toUpperCase()}</option>`).join('')}</select></div><div class="form-field"><div class="form-label">Target Date</div><input type="date" class="form-input" id="vDate" value="${it.targetDate||''}"></div><div class="form-field"><div class="form-label">Status</div><div class="quad-group" style="grid-template-columns:1fr 1fr 1fr">${statuses.map(s=>`<button type="button" class="quad-btn ${s===it.status?'active':''}" data-vs="${s}">${s.toUpperCase().replace('-',' ')}</button>`).join('')}</div></div><div class="form-field"><div class="form-label">Description / Why</div><textarea class="form-textarea" id="vDesc">${escapeHTML(it.description||'')}</textarea></div><button class="btn full" onclick="saveEditVisionItem('${id}')">SAVE</button><button class="btn danger outline full" onclick="deleteVisionItem('${id}')">DELETE</button><button class="btn full outline" onclick="closeModal()">CANCEL</button></div>`);document.querySelectorAll('[data-vs]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('[data-vs]').forEach(x=>x.classList.remove('active'));b.classList.add('active')}))};

window.saveEditVisionItem=(id)=>{const it=store.visionBoard.find(x=>x.id===id);if(!it)return;const status=document.querySelector('[data-vs].active');it.title=document.getElementById('vTitle').value||it.title;it.imageUrl=document.getElementById('vImg').value;it.category=document.getElementById('vCat').value;it.targetDate=document.getElementById('vDate').value||null;it.status=status?status.dataset.vs:it.status;it.description=document.getElementById('vDesc').value;saveAll();closeModal();renderVision();showToast("UPDATED")};

window.deleteVisionItem=(id)=>{if(!confirm("Delete this vision?"))return;store.visionBoard=store.visionBoard.filter(x=>x.id!==id);saveAll();closeModal();renderVision()};

// ============ DREAMSCAPE ============
function renderDreamscape(){const dream=store.dreamScape||'';document.getElementById('dreamscapeContent').innerHTML=`<div class="section"><div class="section-label"><span>Dreamscape</span><span class="meta">Read at 4:30 AM</span></div><div class="faith-anchor"><div style="font-family:var(--serif);font-size:13px;letter-spacing:0.2em;color:var(--gold);font-weight:600;margin-bottom:10px">WRITE THE FUTURE AS IF IT EXISTS</div><div style="font-size:13px;color:var(--text-dim);line-height:1.6">First person. Present tense. Sensory detail. Don't describe what you'll do — describe what you're seeing, feeling, smelling, hearing, touching. Read it out loud every morning at 4:30 AM until it feels like a memory.</div></div><div class="card" style="padding:24px"><div style="font-family:var(--serif);font-size:18px;line-height:1.7;color:var(--text);white-space:pre-wrap;min-height:200px">${dream?escapeHTML(dream):'<span style="color:var(--text-faint);font-style:italic">Empty. Tap edit and start writing your future.</span>'}</div></div><div class="goal-actions" style="margin-top:14px;justify-content:center"><button class="btn lg" onclick="editDreamscape()">✎ EDIT DREAMSCAPE</button></div></div>`}

window.editDreamscape=()=>{const dream=store.dreamScape||'';openModal(`<h3>Dreamscape</h3><p style="color:var(--text-dim);font-size:12px;margin-bottom:14px;font-style:italic">First person. Present tense. Sensory detail.</p><div class="form-grid"><div class="form-field"><textarea class="form-textarea" id="dreamEdit" style="min-height:360px;font-family:var(--serif);font-size:15px;line-height:1.6">${escapeHTML(dream)}</textarea></div><button class="btn full" onclick="saveDreamscape()">SAVE</button><button class="btn full outline" onclick="closeModal()">CANCEL</button></div>`)};
window.saveDreamscape=()=>{store.dreamScape=document.getElementById('dreamEdit').value;saveAll();closeModal();renderDreamscape();showToast("DREAMSCAPE SAVED")};

// ============ DAILY JOURNAL ============
function renderJournal(){if(!store.dailyJournal)store.dailyJournal={};const today=todayStr();const todayEntry=store.dailyJournal[today]||'';const allDates=Object.keys(store.dailyJournal).sort().reverse().filter(d=>d!==today);
document.getElementById('journalContent').innerHTML=`<div class="section"><div class="section-label"><span>Daily Journal</span><span class="meta">${new Date().toLocaleDateString('en-US',{weekday:'long',month:'short',day:'numeric'})}</span></div><div class="card" style="padding:18px"><div style="font-family:var(--serif);font-size:13px;letter-spacing:0.2em;color:var(--gold);font-weight:600;margin-bottom:10px">TODAY'S ENTRY</div><textarea class="form-textarea" id="journalToday" style="min-height:260px;font-family:var(--serif);font-size:15px;line-height:1.7" placeholder="What happened. What you learned. What you're carrying. What's the truth right now.">${escapeHTML(todayEntry)}</textarea><button class="btn full lg" style="margin-top:12px" onclick="saveJournalToday()">SAVE TODAY'S ENTRY</button></div></div>${allDates.length?`<div class="section"><div class="section-label"><span>Past Entries</span><span class="meta">${allDates.length} entries</span></div>${allDates.slice(0,30).map(d=>`<div class="faith-entry"><div class="faith-entry-date">${new Date(d+'T12:00:00').toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric',year:'numeric'})}</div><div class="faith-entry-text">${escapeHTML(store.dailyJournal[d])}</div><div style="margin-top:6px;display:flex;gap:6px"><button class="btn outline sm" onclick="editJournalEntry('${d}')">EDIT</button><button class="btn danger outline sm" onclick="deleteJournalEntry('${d}')">DELETE</button></div></div>`).join('')}</div>`:''}`}

window.saveJournalToday=()=>{const today=todayStr();const text=document.getElementById('journalToday').value;if(!text){alert("Write something first");return}if(!store.dailyJournal)store.dailyJournal={};store.dailyJournal[today]=text;saveAll();showToast("ENTRY SAVED");renderJournal()};
window.editJournalEntry=(date)=>{const text=store.dailyJournal[date]||'';openModal(`<h3>Edit Entry · ${new Date(date+'T12:00:00').toLocaleDateString('en-US',{weekday:'long',month:'short',day:'numeric'})}</h3><div class="form-grid"><div class="form-field"><textarea class="form-textarea" id="journalEditText" style="min-height:300px;font-family:var(--serif);font-size:15px;line-height:1.7">${escapeHTML(text)}</textarea></div><button class="btn full" onclick="saveJournalEdit('${date}')">SAVE</button><button class="btn full outline" onclick="closeModal()">CANCEL</button></div>`)};
window.saveJournalEdit=(date)=>{store.dailyJournal[date]=document.getElementById('journalEditText').value;saveAll();closeModal();renderJournal();showToast("ENTRY UPDATED")};
window.deleteJournalEntry=(date)=>{if(!confirm("Delete this entry?"))return;delete store.dailyJournal[date];saveAll();renderJournal()};

// ============ FAITH ============
let faithView='dashboard';
function renderFaith(){if(!store.faith)store.faith={anchorVerse:'',anchorRef:'',scripture:[],prayer:[],gratitude:[],reflections:[],verses:[]};const f=store.faith;
document.getElementById('faithContent').innerHTML=`<div class="section">${f.anchorVerse?`<div class="faith-anchor"><div class="faith-anchor-verse">"${escapeHTML(f.anchorVerse)}"</div><div class="faith-anchor-ref">— ${escapeHTML(f.anchorRef||'')}</div><button class="btn outline sm" style="margin-top:12px" onclick="editAnchor()">EDIT ANCHOR</button></div>`:`<div class="faith-anchor"><div style="color:var(--text-dim);font-style:italic;margin-bottom:10px">Set your anchor verse</div><button class="btn outline" onclick="editAnchor()">+ ANCHOR VERSE</button></div>`}<div class="faith-tabs"><button class="${faithView==='dashboard'?'active':''}" onclick="switchFaithView('dashboard')">Dashboard</button><button class="${faithView==='scripture'?'active':''}" onclick="switchFaithView('scripture')">Scripture</button><button class="${faithView==='prayer'?'active':''}" onclick="switchFaithView('prayer')">Prayer</button><button class="${faithView==='gratitude'?'active':''}" onclick="switchFaithView('gratitude')">Gratitude</button><button class="${faithView==='reflections'?'active':''}" onclick="switchFaithView('reflections')">Reflections</button><button class="${faithView==='verses'?'active':''}" onclick="switchFaithView('verses')">My Verses</button></div><div id="faithBody"></div></div>`;
renderFaithBody()}

window.switchFaithView=(v)=>{faithView=v;renderFaithBody()};

function renderFaithBody(){const f=store.faith;const body=document.getElementById('faithBody');if(!body)return;
if(faithView==='dashboard'){const sCount=(f.scripture||[]).length;const pCount=(f.prayer||[]).filter(p=>!p.answered).length;const aCount=(f.prayer||[]).filter(p=>p.answered).length;const gCount=(f.gratitude||[]).length;const rCount=(f.reflections||[]).length;const recentG=(f.gratitude||[]).slice(-3).reverse();const recentP=(f.prayer||[]).filter(p=>!p.answered).slice(-3).reverse();
body.innerHTML=`<div class="kpi-grid" style="grid-template-columns:repeat(2,1fr);margin-bottom:14px">
<div class="kpi"><div class="kpi-label">Scripture Reads</div><div class="kpi-value">${sCount}</div></div>
<div class="kpi"><div class="kpi-label">Prayers Open</div><div class="kpi-value">${pCount}</div></div>
<div class="kpi"><div class="kpi-label">Prayers Answered</div><div class="kpi-value">${aCount}</div></div>
<div class="kpi"><div class="kpi-label">Gratitude Entries</div><div class="kpi-value">${gCount}</div></div>
</div>
<div class="faith-block"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><div style="font-family:var(--serif);font-size:14px;color:var(--gold);letter-spacing:0.2em;text-transform:uppercase;font-weight:600">Recent Gratitude</div><button class="btn outline sm" onclick="addGratitude()">+ LOG</button></div>${recentG.length?recentG.map(g=>`<div class="faith-entry"><div class="faith-entry-date">${new Date(g.date).toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})}</div><div class="faith-entry-text">${escapeHTML(g.text)}</div></div>`).join(''):'<div class="empty" style="padding:14px 0">Nothing logged. Add one.</div>'}</div>
<div class="faith-block"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><div style="font-family:var(--serif);font-size:14px;color:var(--gold);letter-spacing:0.2em;text-transform:uppercase;font-weight:600">Open Prayers</div><button class="btn outline sm" onclick="addPrayer()">+ LOG</button></div>${recentP.length?recentP.map(p=>`<div class="faith-entry"><div class="faith-entry-date">${new Date(p.date).toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})}</div><div class="faith-entry-text">${escapeHTML(p.text)}</div></div>`).join(''):'<div class="empty" style="padding:14px 0">No open prayers.</div>'}</div>`}
else if(faithView==='scripture'){const entries=(f.scripture||[]).slice().reverse();body.innerHTML=`<div class="goal-actions" style="margin-bottom:10px"><button class="btn outline sm" onclick="addScripture()">+ LOG READING</button></div>${entries.length?entries.map(s=>`<div class="faith-entry"><div class="faith-entry-date">${new Date(s.date).toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})}</div><div class="faith-entry-text"><strong style="color:var(--gold)">${escapeHTML(s.passage||'—')}</strong>${s.notes?'\n'+escapeHTML(s.notes):''}</div><div style="margin-top:6px"><button class="btn outline sm" onclick="deleteFaithEntry('scripture','${s.id}')">×</button></div></div>`).join(''):'<div class="empty">No scripture logged yet.</div>'}`}
else if(faithView==='prayer'){const entries=(f.prayer||[]).slice().reverse();body.innerHTML=`<div class="goal-actions" style="margin-bottom:10px"><button class="btn outline sm" onclick="addPrayer()">+ LOG PRAYER</button></div>${entries.length?entries.map(p=>`<div class="faith-entry ${p.answered?'answered':''}"><div class="faith-entry-date">${new Date(p.date).toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})}${p.answered?' · <span style="color:var(--green)">ANSWERED</span>':''}</div><div class="faith-entry-text">${escapeHTML(p.text)}</div>${p.answeredText?`<div class="faith-entry-meta">Answer: ${escapeHTML(p.answeredText)}</div>`:''}<div style="margin-top:6px;display:flex;gap:6px">${!p.answered?`<button class="btn outline sm" onclick="markPrayerAnswered('${p.id}')">MARK ANSWERED</button>`:''}<button class="btn outline sm" onclick="deleteFaithEntry('prayer','${p.id}')">×</button></div></div>`).join(''):'<div class="empty">No prayers logged yet.</div>'}`}
else if(faithView==='gratitude'){const entries=(f.gratitude||[]).slice().reverse();body.innerHTML=`<div class="goal-actions" style="margin-bottom:10px"><button class="btn outline sm" onclick="addGratitude()">+ LOG GRATITUDE</button></div>${entries.length?entries.map(g=>`<div class="faith-entry"><div class="faith-entry-date">${new Date(g.date).toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})}</div><div class="faith-entry-text">${escapeHTML(g.text)}</div><div style="margin-top:6px"><button class="btn outline sm" onclick="deleteFaithEntry('gratitude','${g.id}')">×</button></div></div>`).join(''):'<div class="empty">No gratitude logged yet.</div>'}`}
else if(faithView==='reflections'){const entries=(f.reflections||[]).slice().reverse();body.innerHTML=`<div class="goal-actions" style="margin-bottom:10px"><button class="btn outline sm" onclick="addReflection()">+ WEEKLY REFLECTION</button></div>${entries.length?entries.map(r=>`<div class="faith-entry"><div class="faith-entry-date">Week of ${new Date(r.date).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}</div><div class="faith-entry-text">${escapeHTML(r.text)}</div><div style="margin-top:6px"><button class="btn outline sm" onclick="deleteFaithEntry('reflections','${r.id}')">×</button></div></div>`).join(''):'<div class="empty">No reflections yet. Add one each Sunday after the Life Op Meeting.</div>'}`}
else if(faithView==='verses'){const entries=(f.verses||[]).slice();body.innerHTML=`<div class="goal-actions" style="margin-bottom:10px"><button class="btn outline sm" onclick="addVerse()">+ ADD VERSE</button></div>${entries.length?entries.map(v=>`<div class="faith-entry"><div class="faith-entry-text"><em>"${escapeHTML(v.text)}"</em><div style="font-family:var(--serif);color:var(--gold);font-size:12px;letter-spacing:0.15em;margin-top:6px">— ${escapeHTML(v.ref||'')}</div></div><div style="margin-top:6px"><button class="btn outline sm" onclick="setAsAnchor('${v.id}')">SET AS ANCHOR</button> <button class="btn outline sm" onclick="deleteFaithEntry('verses','${v.id}')">×</button></div></div>`).join(''):'<div class="empty">No verses saved. Add anchor verses you return to.</div>'}`}}

window.editAnchor=()=>{const f=store.faith;openModal(`<h3>Anchor Verse</h3><p style="color:var(--text-dim);font-size:12px;margin-bottom:14px">The verse you return to. Shows at the top of your Faith tab.</p><div class="form-grid"><div class="form-field"><div class="form-label">Verse Text</div><textarea class="form-textarea" id="anchorVerse" style="min-height:100px">${escapeHTML(f.anchorVerse||'')}</textarea></div><div class="form-field"><div class="form-label">Reference (e.g., Joshua 1:9)</div><input type="text" class="form-input" id="anchorRef" value="${escapeHTML(f.anchorRef||'')}"></div><button class="btn full" onclick="saveAnchor()">SAVE</button><button class="btn full outline" onclick="closeModal()">CANCEL</button></div>`)};
window.saveAnchor=()=>{store.faith.anchorVerse=document.getElementById('anchorVerse').value;store.faith.anchorRef=document.getElementById('anchorRef').value;saveAll();closeModal();renderFaith();showToast("ANCHOR SAVED")};

window.addScripture=()=>{openModal(`<h3>Log Scripture Reading</h3><div class="form-grid"><div class="form-field"><div class="form-label">Passage</div><input type="text" class="form-input" id="sPassage" placeholder="e.g., Psalm 23, John 14:1-6" autofocus></div><div class="form-field"><div class="form-label">Notes / What stood out</div><textarea class="form-textarea" id="sNotes"></textarea></div><button class="btn full" onclick="saveScripture()">SAVE</button><button class="btn full outline" onclick="closeModal()">CANCEL</button></div>`)};
window.saveScripture=()=>{if(!store.faith.scripture)store.faith.scripture=[];const passage=document.getElementById('sPassage').value;if(!passage){alert("Passage required");return}store.faith.scripture.push({id:'s_'+Date.now().toString(36),date:todayStr(),passage,notes:document.getElementById('sNotes').value});saveAll();closeModal();renderFaithBody();showToast("LOGGED")};

window.addPrayer=()=>{openModal(`<h3>Log Prayer</h3><div class="form-grid"><div class="form-field"><div class="form-label">What you're praying for</div><textarea class="form-textarea" id="pText" autofocus></textarea></div><button class="btn full" onclick="savePrayer()">SAVE</button><button class="btn full outline" onclick="closeModal()">CANCEL</button></div>`)};
window.savePrayer=()=>{if(!store.faith.prayer)store.faith.prayer=[];const text=document.getElementById('pText').value;if(!text){alert("Prayer text required");return}store.faith.prayer.push({id:'p_'+Date.now().toString(36),date:todayStr(),text,answered:false});saveAll();closeModal();renderFaithBody();showToast("LOGGED")};
window.markPrayerAnswered=(id)=>{const p=store.faith.prayer.find(x=>x.id===id);if(!p)return;openModal(`<h3>Mark Prayer Answered</h3><p style="color:var(--text-dim);font-size:13px;margin-bottom:12px">${escapeHTML(p.text)}</p><div class="form-grid"><div class="form-field"><div class="form-label">How was it answered?</div><textarea class="form-textarea" id="pAnswer" autofocus></textarea></div><button class="btn full" onclick="savePrayerAnswered('${id}')">SAVE</button><button class="btn full outline" onclick="closeModal()">CANCEL</button></div>`)};
window.savePrayerAnswered=(id)=>{const p=store.faith.prayer.find(x=>x.id===id);if(!p)return;p.answered=true;p.answeredText=document.getElementById('pAnswer').value;p.answeredDate=todayStr();saveAll();closeModal();renderFaithBody();showToast("PRAISE")};

window.addGratitude=()=>{openModal(`<h3>Log Gratitude</h3><p style="color:var(--text-dim);font-size:12px;margin-bottom:12px">What are you thankful for today?</p><div class="form-grid"><div class="form-field"><textarea class="form-textarea" id="gText" autofocus style="min-height:120px"></textarea></div><button class="btn full" onclick="saveGratitude()">SAVE</button><button class="btn full outline" onclick="closeModal()">CANCEL</button></div>`)};

window.addReflection=()=>{openModal(`<h3>Weekly Reflection</h3><p style="color:var(--text-dim);font-size:12px;margin-bottom:12px">What did God teach you this week? Where did you see Him work?</p><div class="form-grid"><div class="form-field"><textarea class="form-textarea" id="rText" autofocus style="min-height:160px"></textarea></div><button class="btn full" onclick="saveReflection()">SAVE</button><button class="btn full outline" onclick="closeModal()">CANCEL</button></div>`)};
